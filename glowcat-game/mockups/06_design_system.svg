<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" font-family="'Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="eyeds" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8ff8a"/><stop offset="100%" stop-color="#8ef548"/></linearGradient>
  </defs>
  <rect width="1280" height="1040" fill="#06090d"/>
  <text x="48" y="64" font-size="38" font-weight="800" fill="#eafaff">디자인 시스템 v0.2</text>
  <text x="50" y="94" font-size="16" fill="#34e2e2">D9 반영 · 토큰 · 메모리 미터 4상태 · 색약/대비 · 시점 규칙</text>

  <!-- ===== COLOR TOKENS ===== -->
  <text x="48" y="140" font-size="20" font-weight="700" fill="#8ef548">색 토큰 (역할 고정)</text>
  <g transform="translate(48,156)" font-size="13">
    <g><rect width="150" height="64" rx="8" fill="#06090d" stroke="#1d3236"/><text x="10" y="24" fill="#eafaff">--bg</text><text x="10" y="44" fill="#5a7375">#06090d</text><text x="10" y="60" fill="#5a7375">배경</text></g>
    <g transform="translate(162,0)"><rect width="150" height="64" rx="8" fill="#0a1014" stroke="#1d3236"/><text x="10" y="24" fill="#eafaff">--panel</text><text x="10" y="44" fill="#5a7375">#0a1014</text><text x="10" y="60" fill="#5a7375">패널</text></g>
    <g transform="translate(324,0)"><rect width="150" height="64" rx="8" fill="#34e2e2"/><text x="10" y="24" fill="#06121a" font-weight="700">--cyan</text><text x="10" y="44" fill="#06121a">#34e2e2</text><text x="10" y="60" fill="#06121a">중립 UI/상호작용</text></g>
    <g transform="translate(486,0)"><rect width="150" height="64" rx="8" fill="#8ef548"/><text x="10" y="24" fill="#0a1c06" font-weight="700">--lime</text><text x="10" y="44" fill="#0a1c06">#8ef548</text><text x="10" y="60" fill="#0a1c06">긍정/해금 전용</text></g>
    <g transform="translate(648,0)"><rect width="150" height="64" rx="8" fill="#ff5a5a"/><text x="10" y="24" fill="#2a0606" font-weight="700">--danger</text><text x="10" y="44" fill="#2a0606">#ff5a5a</text><text x="10" y="60" fill="#2a0606">위험/후퇴</text></g>
    <g transform="translate(810,0)"><rect width="150" height="64" rx="8" fill="#d9a86a"/><text x="10" y="24" fill="#2a1a08" font-weight="700">--warm</text><text x="10" y="44" fill="#2a1a08">#d9a86a</text><text x="10" y="60" fill="#2a1a08">회상(과거)</text></g>
    <g transform="translate(972,0)"><rect width="210" height="64" rx="8" fill="#0a1014" stroke="#1d3236"/><text x="10" y="22" fill="#eafaff">텍스트 1/2/3</text><text x="10" y="42" fill="#eafaff">#eafaff </text><text x="78" y="42" fill="#8aa7a9">#8aa7a9 </text><text x="146" y="42" fill="#5a7375">#5a7375</text><text x="10" y="58" fill="#5a7375">잠금텍스트 ≥3:1 (대비 수정)</text></g>
  </g>
  <text x="48" y="252" font-size="13" fill="#8aa7a9">※ 시안=중립 UI / 연두=긍정·해금으로 역할 분리(한 화면에서 두 색이 다른 의미 갖지 않게) → 적록색약 수렴 방지.</text>

  <!-- ===== MEMORY METER STATES ===== -->
  <text x="48" y="300" font-size="20" font-weight="700" fill="#8ef548">메모리 미터 — 칸 토큰 4상태 (0.5칸 표현 + 색약 대응)</text>
  <g transform="translate(48,320)">
    <!-- empty -->
    <g><rect width="150" height="92" rx="8" fill="#0a1014" stroke="#1d3236"/>
      <g transform="translate(58,18) scale(1.4)" fill="#16262a" stroke="#24424a" stroke-width="1"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
      <text x="75" y="84" font-size="13" fill="#8aa7a9" text-anchor="middle">empty (빈칸)</text></g>
    <!-- half -->
    <g transform="translate(162,0)"><rect width="150" height="92" rx="8" fill="#0a1014" stroke="#1d3236"/>
      <g transform="translate(58,18) scale(1.4)"><g fill="#16262a"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
      <clipPath id="halfclip"><rect x="-2" y="0" width="16" height="34"/></clipPath>
      <g fill="#34e2e2" clip-path="url(#halfclip)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/></g></g>
      <text x="75" y="84" font-size="13" fill="#8aa7a9" text-anchor="middle">half (0.5칸)</text></g>
    <!-- full -->
    <g transform="translate(324,0)"><rect width="150" height="92" rx="8" fill="#0a1014" stroke="#1d3236"/>
      <g transform="translate(58,18) scale(1.4)" fill="#34e2e2"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
      <text x="75" y="84" font-size="13" fill="#8aa7a9" text-anchor="middle">full (채움)</text></g>
    <!-- danger -->
    <g transform="translate(486,0)"><rect width="150" height="92" rx="8" fill="#0a1014" stroke="#3a1a1a"/>
      <g transform="translate(58,18) scale(1.4)" fill="#ff5a5a"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/>
      <path d="M 8,2 L 20,30 M 22,4 L 6,26" stroke="#06090d" stroke-width="1.6"/></g>
      <text x="75" y="84" font-size="13" fill="#ff9a9a" text-anchor="middle">danger (금감/형태변화)</text></g>
  </g>
  <!-- assembled meter 3.5/10 with grouping -->
  <g transform="translate(660,320)">
    <rect width="572" height="92" rx="10" fill="#0a1014" stroke="#1d3236"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#bfffff">조립 예시 · 3.5 / 10</text>
    <g transform="translate(20,40)">
      <!-- group 1 (5) -->
      <g>
        <g fill="#34e2e2"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(36,0)" fill="#34e2e2"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(72,0)" fill="#34e2e2"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <!-- half pip -->
        <g transform="translate(108,0)"><g fill="#16262a"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g><clipPath id="h2"><rect x="-2" y="0" width="16" height="34"/></clipPath><g fill="#34e2e2" clip-path="url(#h2)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/></g></g>
        <g transform="translate(144,0)" fill="#16262a"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
      </g>
      <!-- gap -->
      <line x1="184" y1="2" x2="184" y2="30" stroke="#1d3236" stroke-width="2"/>
      <!-- group 2 (5 empty) -->
      <g transform="translate(196,0)" fill="#16262a">
        <g><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(36,0)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(72,0)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(108,0)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
        <g transform="translate(144,0)"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/><circle cx="26" cy="15" r="3"/></g>
      </g>
    </g>
    <text x="20" y="86" font-size="12" fill="#8aa7a9">5+5 그룹핑 → subitizing 용이. 색 외 형태(반쪽·금)로 색약·흑백에서도 판독.</text>
  </g>

  <!-- ===== STATUS ENCODING (color + shape) ===== -->
  <text x="48" y="470" font-size="20" font-weight="700" fill="#8ef548">상태 = 색 + 형태 이중 인코딩</text>
  <g transform="translate(48,486)" font-size="14">
    <g><rect width="270" height="60" rx="8" fill="#0a1014" stroke="#2a6e72"/><text x="16" y="36" fill="#8ef548" font-size="22">✓</text><text x="48" y="32" fill="#eafaff">해금/완료</text><text x="48" y="50" fill="#8aa7a9" font-size="12">연두 + 체크 형태</text></g>
    <g transform="translate(284,0)"><rect width="270" height="60" rx="8" fill="#0a1014" stroke="#8ef548" stroke-dasharray="6 5"/><text x="16" y="38" fill="#8ef548" font-size="14">60%</text><text x="60" y="32" fill="#eafaff">진행 중</text><text x="60" y="50" fill="#8aa7a9" font-size="12">점선 테두리 + 퍼센트</text></g>
    <g transform="translate(568,0)"><rect width="270" height="60" rx="8" fill="#080c0f" stroke="#243036"/><path d="M 22,34 v-6 a5,5 0 0 1 10,0 v6" fill="none" stroke="#5a7375" stroke-width="3"/><rect x="18" y="34" width="18" height="13" rx="3" fill="#5a7375"/><text x="52" y="32" fill="#8aa7a9">잠김</text><text x="52" y="50" fill="#5a7375" font-size="12">자물쇠 형태 (대비 ≥3:1)</text></g>
    <g transform="translate(852,0)"><rect width="330" height="60" rx="8" fill="#0a1014" stroke="#1d3236"/><ellipse cx="28" cy="30" rx="18" ry="20" fill="#241c2e"/><circle cx="20" cy="26" r="4" fill="#9a86d8"/><circle cx="34" cy="26" r="4" fill="#9a86d8"/><text x="56" y="28" fill="#eafaff">적 식별 = 실루엣/모션</text><text x="56" y="46" fill="#8aa7a9" font-size="12">Murk 뭉게짐 / Echo 흩날림 (색 아님)</text></g>
  </g>

  <!-- ===== PERSPECTIVE RULE ===== -->
  <text x="48" y="600" font-size="20" font-weight="700" fill="#8ef548">시점 규칙 (D4) — 정면 치비는 초상 전용, 인게임은 3/4 쿼터뷰</text>
  <!-- front chibi = portrait only -->
  <g transform="translate(48,620)">
    <rect width="360" height="360" rx="12" fill="#0a1014" stroke="#1d3236"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#34e2e2">정면 치비 — 초상/메뉴/회상 전용</text>
    <g transform="translate(180,210) scale(0.82)">
      <ellipse cx="0" cy="120" rx="62" ry="78" fill="#0d0d10"/>
      <ellipse cx="-26" cy="188" rx="17" ry="24" fill="#34e2e2"/><ellipse cx="26" cy="188" rx="17" ry="24" fill="#34e2e2"/>
      <path d="M -78,-58 L -38,-150 L -8,-60 Z" fill="#0d0d10"/><path d="M -62,-66 L -40,-120 L -24,-66 Z" fill="#34e2e2"/>
      <path d="M 78,-58 L 38,-150 L 8,-60 Z" fill="#0d0d10"/><path d="M 62,-66 L 40,-120 L 24,-66 Z" fill="#34e2e2"/>
      <ellipse cx="0" cy="-8" rx="98" ry="92" fill="#0e0f13"/>
      <ellipse cx="-40" cy="-10" rx="36" ry="42" fill="url(#eyeds)" stroke="#34e2e2" stroke-width="5"/>
      <ellipse cx="40" cy="-10" rx="36" ry="42" fill="url(#eyeds)" stroke="#34e2e2" stroke-width="5"/>
      <rect x="-43" y="-34" width="6" height="40" rx="3" fill="#5af0f0"/><rect x="37" y="-34" width="6" height="40" rx="3" fill="#5af0f0"/>
      <path d="M -12,34 Q 0,46 12,34" fill="none" stroke="#34e2e2" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="180" y="344" font-size="12" fill="#8aa7a9" text-anchor="middle">시그니처(눈·발자국 마크)가 잘 보임</text>
  </g>
  <!-- quarter view = in-game -->
  <g transform="translate(432,620)">
    <rect width="360" height="360" rx="12" fill="#0d0f0c" stroke="#1d3236"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#8ef548">3/4 쿼터뷰 — 인게임 (+발자국 트레일)</text>
    <!-- paw trail -->
    <g fill="#34e2e2"><g transform="translate(70,300) scale(0.5)" opacity="0.25"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/></g>
      <g transform="translate(110,270) scale(0.55)" opacity="0.4"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/></g>
      <g transform="translate(150,238) scale(0.6)" opacity="0.6"><ellipse cx="14" cy="22" rx="9" ry="7"/><circle cx="6" cy="11" r="3.4"/><circle cx="13" cy="7" r="3.6"/><circle cx="21" cy="9" r="3.4"/></g></g>
    <!-- 3/4 cat: seen from behind-above, head turned -->
    <g transform="translate(210,190)">
      <!-- tail -->
      <path d="M 55,60 C 110,55 120,0 88,-18 C 110,8 80,40 50,42 Z" fill="#0d0d10"/><path d="M 96,-12 C 112,2 100,28 80,34 C 104,18 104,2 90,-10 Z" fill="#34e2e2"/>
      <!-- body (back, oval) -->
      <ellipse cx="0" cy="40" rx="62" ry="74" fill="#0d0d10"/>
      <!-- back cyan stripe -->
      <path d="M 0,-20 C 14,20 14,70 0,108 C -14,70 -14,20 0,-20 Z" fill="#16343a" opacity="0.8"/>
      <!-- haunches/paws hint -->
      <ellipse cx="-42" cy="92" rx="16" ry="20" fill="#34e2e2" opacity="0.85"/><ellipse cx="42" cy="92" rx="16" ry="20" fill="#34e2e2" opacity="0.85"/>
      <!-- head (turned, top of head + ears) -->
      <ellipse cx="0" cy="-34" rx="56" ry="48" fill="#0e0f13"/>
      <path d="M -54,-44 L -30,-104 L -8,-46 Z" fill="#0d0d10"/><path d="M -44,-50 L -30,-86 L -18,-50 Z" fill="#34e2e2"/>
      <path d="M 54,-44 L 30,-104 L 8,-46 Z" fill="#0d0d10"/><path d="M 44,-50 L 30,-86 L 18,-50 Z" fill="#34e2e2"/>
      <!-- peeking eyes (head tilted forward-down) -->
      <ellipse cx="-18" cy="-20" rx="11" ry="9" fill="url(#eyeds)"/><ellipse cx="18" cy="-20" rx="11" ry="9" fill="url(#eyeds)"/>
    </g>
    <text x="180" y="344" font-size="12" fill="#8aa7a9" text-anchor="middle">등·귀·꼬리 글로우 + 이동 발자국으로 시그니처 보완</text>
  </g>
  <!-- notes -->
  <g transform="translate(816,620)">
    <rect width="416" height="360" rx="12" fill="#0a1014" stroke="#1d3236"/>
    <text x="20" y="36" font-size="15" font-weight="700" fill="#34e2e2">컴포넌트 &amp; 규칙 메모</text>
    <g font-size="13.5" fill="#cfe6e6"><text x="20" y="70">• 컴포넌트화: 미터칸 · 슬롯 · 토스트 · 버튼 · 초상</text>
    <text x="20" y="96">• 상태: default/hover/focus/pressed/disabled</text>
    <text x="20" y="122">• 터치/포인터 타깃 ≥ 44px, 세이프에어리어 준수</text>
    <text x="20" y="148">• 타이포 스케일 / 8px 스페이싱 / 라운드 8·12</text>
    <text x="20" y="174">• 글로우 = 펄스(주기 ≥ 0.4s, 플리커 &lt; 3Hz)</text>
    <text x="20" y="200" fill="#ff9a9a">• 광과민성: 적색 고채도 번쩍임 금지</text>
    <text x="20" y="226">• 정체성 진행은 단일 GameState 값 → HUD·카드 동일</text>
    <text x="20" y="252" fill="#8aa7a9">  (구 목업의 HUD 1/5 vs 카드 3/5 = 같은 변수로 통일)</text>
    <text x="20" y="284">• HUD는 모서리 고정·반투명, 비전투 시 페이드</text>
    <text x="20" y="310" fill="#8aa7a9">  → 탑다운 플레이 공간 침범 최소화</text></g>
  </g>

  <rect x="0" y="0" width="1280" height="6" fill="#34e2e2" opacity="0.5"/>
</svg>
