<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잊혀진 발자국 — 지로 (Vertical Slice)</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;color:#cfe6e6;overflow:hidden;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;height:100dvh;gap:6px;box-sizing:border-box;
    padding:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom));}
  /* 캔버스(1056×672)를 뷰포트 가로·세로 모두에 맞춰 축소(스킬버튼이 창 밖으로 잘리지 않게). */
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#06090d;touch-action:none;display:block;
    border:1px solid #1d3236;box-shadow:0 0 40px rgba(52,226,226,.08);
    width:auto;height:auto;max-width:100%;max-height:calc(100vh - 54px);max-height:calc(100dvh - 54px);}
  #hint{font-size:12px;color:#5a7375;letter-spacing:.3px;text-align:center;line-height:1.4;flex:0 0 auto;}
  #hint b{color:#8ef548;font-weight:700;}
  a{color:#34e2e2;}
  @media (max-height:520px){ #hint{display:none;} canvas{max-height:calc(100dvh - 12px);} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1056" height="672"></canvas>
  <div id="hint">키보드: 이동 <b>WASD/←↑↓→</b> · 조사 <b>E</b> · 추적 <b>L</b> · 비추기 <b>Q</b> · 일지 <b>Tab</b> · 힌트 <b>H</b> · 은신 <b>Shift</b><br>
    터치/태블릿: <b>왼쪽 드래그</b>로 이동 · <b>오른쪽 버튼</b>으로 스킬 (우상단 "터치 조작"으로 켜고 끄기)</div>
</div>
<!-- 로드 순서: 에셋 → 규칙 → 데이터 → 오디오 → 메인 -->
<script src="assets.js"></script>
<script src="illust.js"></script>
<script src="core.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="journal.js"></script>
<script src="main.js"></script>
</body>
</html>
