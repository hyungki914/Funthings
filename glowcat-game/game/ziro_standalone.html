<style>
  html,body{margin:0;height:100%;background:#04060a;color:#cfe6e6;overflow:hidden;

  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;

    width:auto;height:auto;max-width:100%;max-height:calc(100vh - 54px);max-height:calc(100dvh - 54px);}
  #hint{font-size:12px;color:#5a7375;letter-spacing:.3px;text-align:center;line-height:1.4;flex:0 0 auto;}
  #hint b{color:#8ef548;font-weight:700;}
  a{color:#34e2e2;}
  @media (max-height:520px){ #hint{display:none;} canvas{max-height:calc(100dvh - 12px);} }
</style>

<script>
/* ===== core.js ===== */
// core.js — 『잊혀진 발자국』(지로 Ziro) 순수 규칙 로직 모듈
// DOM/Canvas 사용 금지. 순수 함수만. (10_build_plan §2-1, 03_systems_enemies v2.0)
// 전역 `Core` + Node export 둘 다 지원.
'use strict';

// ---- 상수 (10_build_plan §2-1) ----
const C = {
  MEM_MAX: 10,
  LIGHT_MAX: 6,
  START_MEM: 4,
  START_LIGHT: 3,
  CONTACT: -2,
  CORE_GAIN: +2,
  ECHO_GAIN: +1,
  FALSE_HIT: -2,
  HINT_COST: 1,
  REST_PER_S: 1.0,
  DECAY_PER_S: 0.2,
  IFRAME_S: 1.2,
  PLAYER_SPEED: 64,   // px/s (16px 타일 * 4 스케일 기준 보정)
  STEALTH_SPEED: 38,  // px/s
  SETBACK_MEM: 3,
  // 코어 동사 (v2 증분)
  PROJECT_COST: 0.6,  // 기억 비추기: 초당 빛 소모
  PROJECT_LEN: 46,    // 투사 콘 길이(px)
  PROJECT_HALFDEG: 32,// 투사 콘 반각(도)
  TRAIL_CD: 6.0,      // 발자국 추적 쿨다운(s)
  TRAIL_LIFE: 3.0,    // 발자국 잔존(s)
};

// ---- 헬퍼 ----
function clamp(v, lo, hi) {
  if (v < lo) return lo;
  if (v > hi) return hi;
  return v;
}

// 각도를 -π..π 범위로 정규화
function normAngle(a) {
  const TWO_PI = Math.PI * 2;
  // ((a + π) mod 2π) - π  (음수 mod 보정 포함)
  let r = (a + Math.PI) % TWO_PI;
  if (r < 0) r += TWO_PI;
  return r - Math.PI;
}

// ---- 상태 생성 (§2-1 / §2-2 스키마 입력) ----
function newState(data) {
  data = data || {};
  return {
    mem: C.START_MEM,
    light: C.START_LIGHT,
    iframe: 0,
    coresNeeded: data.coresNeeded,
    collected: new Set(),   // 수집한 조각 id
    coreOrder: [],          // 코어 획득 순서 (후퇴 봉인용)
    sealed: new Set(),      // 임시 봉인된 코어 id
    identity: 0,            // 0..5 정체성 해금 단계
    _coreSlots: {},         // (내부) 코어 id -> identitySlot, 정체성 재계산용
  };
}

// ---- 조각 수집 ----
function collect(state, shard) {
  if (state.collected.has(shard.id)) {
    return { ok: false };
  }
  let gainMem = 0;
  let gainLight = 0;
  const type = shard.type;

  if (type === 'core') {
    gainMem = C.CORE_GAIN;
    gainLight = 1;
    state.identity = Math.max(state.identity, shard.identitySlot + 1);
    state.coreOrder.push(shard.id);
    if (state._coreSlots) state._coreSlots[shard.id] = shard.identitySlot;
  } else if (type === 'echo') {
    gainMem = C.ECHO_GAIN;
    gainLight = 1;
  } else if (type === 'false') {
    gainMem = C.FALSE_HIT;
    gainLight = 0;
  }

  state.mem = clamp(state.mem + gainMem, 0, C.MEM_MAX);
  state.light = clamp(state.light + gainLight, 0, C.LIGHT_MAX);
  state.collected.add(shard.id);

  return {
    ok: true,
    type,
    recallText: shard.recall,
    gainMem,
    gainLight,
    identitySlot: shard.identitySlot,
  };
}

// ---- 적 접촉 ----
function contact(state) {
  if (state.iframe > 0) return false; // 무적 프레임 중 = 무피해
  state.mem = clamp(state.mem + C.CONTACT, 0, C.MEM_MAX);
  state.iframe = C.IFRAME_S;
  return true;
}

// ---- 시간 진행: 회복/감소/iframe 감소 ----
function tick(state, dt, ctx) {
  ctx = ctx || {};
  state.iframe = Math.max(0, state.iframe - dt);
  if (ctx.inSafe) {
    state.mem = Math.min(C.MEM_MAX, state.mem + C.REST_PER_S * dt);
  } else if (ctx.inDanger) {
    state.mem = Math.max(0, state.mem - C.DECAY_PER_S * dt);
  }
}

// ---- 힌트(직감) 사용: 빛 자원 소모 ----
function useHint(state) {
  if (state.light >= C.HINT_COST) {
    state.light -= C.HINT_COST;
    return { ok: true };
  }
  return { ok: false };
}

// ---- 후퇴(Setback): mem<=0 → 최근 코어 1개 임시봉인 + 안전지대 복귀 신호 ----
function setbackIfDead(state) {
  if (state.mem > 0) return false;

  // 가장 최근 획득한 코어를 봉인
  const lastCoreId = state.coreOrder.pop();
  if (lastCoreId !== undefined) {
    state.sealed.add(lastCoreId);
    state.collected.delete(lastCoreId);
  }

  // 남은 코어 기준으로 정체성 재계산
  state.identity = recomputeIdentity(state);

  state.mem = C.SETBACK_MEM;
  return true;
}

// 봉인 처리 후 남은 코어 슬롯으로 정체성 재계산 (없으면 0)
function recomputeIdentity(state) {
  let maxSlot = -1;
  const coreSlots = state._coreSlots || {};
  for (const id of state.coreOrder) {
    const slot = coreSlots[id];
    if (typeof slot === 'number' && slot > maxSlot) maxSlot = slot;
  }
  return maxSlot < 0 ? 0 : maxSlot + 1;
}

// ---- Murk 시야 감지 (거리 + 각도. LoS는 호출측 보강) ----
function murkSees(murk, px, py) {
  const dx = px - murk.x;
  const dy = py - murk.y;
  const dist = Math.hypot(dx, dy);
  if (dist > murk.sight) return false;
  if (dist === 0) return true; // 동일 위치는 항상 감지
  const toPlayer = Math.atan2(dy, dx);
  const diff = Math.abs(normAngle(toPlayer - murk.faceAngle));
  const halfFov = (murk.fov * Math.PI / 180) / 2;
  return diff <= halfFov;
}

// ---- 정체성 상태 ----
function identityState(state) {
  const portraits = ['q', 'silhouette', 'eyes', 'face', 'name'];
  const unlocked = state.identity;
  const portrait = portraits[Math.min(unlocked, 4)];
  return { unlocked, portrait, label: portrait };
}

// ---- 챕터 클리어: 보유 코어 수 >= 필요 수 (봉인된 건 제외) ----
function chapterClear(state) {
  return state.coreOrder.length >= state.coresNeeded;
}

// 투사 콘 판정(순수): (ox,oy)에서 faceAngle 방향 len·halfDeg 콘 안에 (px,py)가 드는가
function inCone(ox, oy, faceAngle, len, halfDeg, px, py) {
  const dx = px - ox, dy = py - oy;
  const dist = Math.hypot(dx, dy);
  if (dist > len) return false;
  if (dist < 0.0001) return true;
  const a = normAngle(Math.atan2(dy, dx) - faceAngle);
  return Math.abs(a) <= halfDeg * Math.PI / 180;
}

const Core = {
  C,
  clamp,
  normAngle,
  inCone,
  newState,
  collect,
  contact,
  tick,
  useHint,
  setbackIfDead,
  murkSees,
  identityState,
  chapterClear,
};

if (typeof window !== 'undefined') window.Core = Core;
if (typeof module !== 'undefined') module.exports = Core;

<script>
/* ===== audio.js ===== */
// audio.js — 『잊혀진 발자국』(지로 Ziro) WebAudio 합성 사운드 모듈
// 외부 음원 파일 0 — 전부 오실레이터/노이즈 합성. (10_build_plan §2-4)
// 미스터리·서스펜스, 잔잔한 톤. 브라우저 자동재생 정책 대응(첫 제스처 후 resume).
//
// 안전 규약:
//  - window/AudioContext 참조는 함수 내부에서만. 모듈 로드 시 즉시 실행 금지.
//  - AudioContext 미지원/예외 시 무음으로 안전 폴백(throw 금지).
//  - ambient/drone/heartbeat는 토글 시 이전 노드/타이머를 반드시 정리(중복 생성 방지·누수 방지).
'use strict';

// ---- 볼륨 상수 (과하지 않게) ----
const MASTER_VOL = 0.3;    // 마스터 기본 게인
const AMBIENT_VOL = 0.05;  // 앰비언트 패드(아주 작게)

// ---- 모듈 내부 상태 (싱글톤) ----
// 모든 라이브 노드/타이머 핸들을 여기 모아 정리 누수를 방지한다.
const S = {
  ctx: null,          // AudioContext
  master: null,       // 마스터 GainNode
  muted: false,
  ambientNodes: null, // { oscs:[], gain, filter, lfo? }
  droneNodes: null,   // { osc, sub, noise, gain, filter }
  droneLevel: 0,
  heart: { timer: null, bpm: 0 }, // setTimeout 핸들 + 현재 bpm
  // ---- BGM 음악 엔진 상태 ----
  // 동시에 두 보이스(이전/새 테마)를 가질 수 있어 크로스페이드 시 둘 다 추적한다.
  music: {
    theme: null,        // 현재 활성 테마 이름
    voices: [],         // [{ theme, def, bus(GainNode), timer, scheduled:[], step, nextTime, fading }]
  },
};

// ---------------------------------------------------------------------------
// 내부 헬퍼 — 전부 폴백 안전(throw 금지)
// ---------------------------------------------------------------------------

// AudioContext 생성자 조회 (브라우저에서만 존재). 없으면 null.
function getCtor() {
  if (typeof window === 'undefined') return null;
  return window.AudioContext || window.webkitAudioContext || null;
}

// 컨텍스트가 살아있고 사용 가능한지.
function ready() {
  return !!(S.ctx && S.master && S.ctx.state !== 'closed');
}

// 현재 시각(초). 컨텍스트 없으면 0.
function now() {
  return S.ctx ? S.ctx.currentTime : 0;
}

// 음소거 반영한 마스터 목표 게인.
function masterTarget() {
  return S.muted ? 0 : MASTER_VOL;
}

// 화이트노이즈 1초 버퍼 생성(짧은 SFX/드론 거칠기용). 실패 시 null.
function makeNoiseBuffer() {
  if (!S.ctx) return null;
  try {
    const len = Math.floor(S.ctx.sampleRate); // 1초
    const buf = S.ctx.createBuffer(1, len, S.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  } catch (e) {
    return null;
  }
}

// 게인 노드를 t0~t1에 걸쳐 부드럽게 변경(클릭 방지). 안전 가드 포함.
function ramp(param, value, t0, dur) {
  try {
    param.cancelScheduledValues(t0);
    param.setValueAtTime(param.value, t0);
    param.linearRampToValueAtTime(value, t0 + dur);
  } catch (e) { /* no-op */ }
}

// 노드 배열/단일 노드를 안전하게 정지·해제.
function stopNode(node, at) {
  if (!node) return;
  try {
    if (typeof node.stop === 'function') node.stop(at);
  } catch (e) { /* 이미 정지됨 등 */ }
  try {
    node.disconnect();
  } catch (e) { /* no-op */ }
}

// 여러 노드를 한 번에 정지.
function stopAll(nodes, at) {
  if (!nodes) return;
  for (let i = 0; i < nodes.length; i++) stopNode(nodes[i], at);
}

// ---------------------------------------------------------------------------
// 공개 API
// ---------------------------------------------------------------------------

// AudioContext 생성(있으면 재사용). 사용자 제스처 핸들러에서 호출 → resume().
function init() {
  try {
    if (!S.ctx) {
      const Ctor = getCtor();
      if (!Ctor) return; // 미지원 → 무음 폴백
      S.ctx = new Ctor();
      S.master = S.ctx.createGain();
      S.master.gain.value = masterTarget();
      S.master.connect(S.ctx.destination);
    }
    // 자동재생 정책: 제스처 컨텍스트에서 resume.
    if (S.ctx.state === 'suspended' && typeof S.ctx.resume === 'function') {
      S.ctx.resume().catch(function () { /* 무시 */ });
    }
  } catch (e) {
    // 생성 실패 → 전체 무음 폴백
    S.ctx = null;
    S.master = null;
  }
}

// 마스터 게인 0/기본 토글.
function setMuted(flag) {
  S.muted = !!flag;
  if (!ready()) return;
  ramp(S.master.gain, masterTarget(), now(), 0.05);
}

function toggleMute() {
  setMuted(!S.muted);
  return S.muted;
}

// 잔잔한 패드: 저음 사인/삼각 디튠 2~3개 + 로우패스. 루프 대신 지속 오실레이터.
function ambient(on) {
  if (!ready()) return;

  // 항상 이전 것 먼저 정지(중복 생성 방지).
  if (S.ambientNodes) {
    const a = S.ambientNodes;
    const t = now();
    ramp(a.gain.gain, 0, t, 0.6);            // 부드럽게 페이드아웃
    stopAll(a.oscs, t + 0.7);
    stopNode(a.lfo, t + 0.7);
    stopNode(a.filter, t + 0.7);
    stopNode(a.gain, t + 0.7);
    S.ambientNodes = null;
  }
  if (!on) return;

  try {
    const t = now();
    const gain = S.ctx.createGain();
    gain.gain.value = 0;
    const filter = S.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 520;            // 따뜻하고 어두운 패드
    filter.Q.value = 0.6;

    // 저음역 디튠 보이싱(루트/5도/옥타브 살짝 어긋나게).
    const voices = [
      { f: 110.0, type: 'sine',     det: -4 }, // A2
      { f: 164.8, type: 'triangle', det: +5 }, // E3 (5도)
      { f: 220.0, type: 'sine',     det: -2 }, // A3 (옥타브)
    ];
    const oscs = [];
    for (let i = 0; i < voices.length; i++) {
      const v = voices[i];
      const o = S.ctx.createOscillator();
      o.type = v.type;
      o.frequency.value = v.f;
      try { o.detune.value = v.det; } catch (e) { /* 일부 환경 */ }
      o.connect(filter);
      o.start(t);
      oscs.push(o);
    }

    // 아주 느린 LFO로 필터 컷오프를 미세하게 흔들어 '숨쉬는' 느낌(서스펜스).
    let lfo = null;
    try {
      lfo = S.ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.07;            // ~14초 주기
      const lfoGain = S.ctx.createGain();
      lfoGain.gain.value = 90;               // ±90Hz 흔들림
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start(t);
      // lfoGain은 lfo와 운명을 같이하므로 별도 추적 불필요(disconnect는 filter 해제 시 정리됨).
    } catch (e) {
      lfo = null;
    }

    filter.connect(gain);
    gain.connect(S.master);
    ramp(gain.gain, AMBIENT_VOL, t, 2.0);    // 천천히 페이드인

    S.ambientNodes = { oscs: oscs, gain: gain, filter: filter, lfo: lfo };
  } catch (e) {
    S.ambientNodes = null;
  }
}

// 기억 조각 획득: 맑은 종소리(사인 아르페지오 + 짧은 감쇠 엔벨로프).
function chime() {
  if (!ready()) return;
  try {
    const t = now();
    // A장조 계열 맑은 3음 아르페지오 (A5, C#6, E6).
    const notes = [880.0, 1108.7, 1318.5];
    const step = 0.10;     // 음 간격
    for (let i = 0; i < notes.length; i++) {
      const start = t + i * step;
      const o = S.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = notes[i];
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.16, start + 0.01); // 빠른 어택
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.9); // 종처럼 길게 감쇠
      o.connect(g);
      g.connect(S.master);
      o.start(start);
      o.stop(start + 1.0); // 끝나면 자동 해제(누수 방지)
    }
  } catch (e) { /* 무음 폴백 */ }
}

// 적 근접/위험: level(0~1) 비례 저음 드론 볼륨/거칠기. 0이면 페이드아웃.
function drone(level) {
  if (!ready()) return;
  let lv = (typeof level === 'number' && isFinite(level)) ? level : 0;
  if (lv < 0) lv = 0;
  if (lv > 1) lv = 1;
  S.droneLevel = lv;

  try {
    const t = now();

    // level<=0 → 페이드아웃 후 정지.
    if (lv <= 0.0001) {
      if (S.droneNodes) {
        const d = S.droneNodes;
        ramp(d.gain.gain, 0, t, 0.8);
        stopNode(d.osc, t + 1.0);
        stopNode(d.sub, t + 1.0);
        stopNode(d.noise, t + 1.0);
        stopNode(d.filter, t + 1.0);
        stopNode(d.gain, t + 1.0);
        S.droneNodes = null;
      }
      return;
    }

    // 아직 없으면 한 번만 생성(중복 생성 방지). 이후엔 파라미터만 갱신.
    if (!S.droneNodes) {
      const gain = S.ctx.createGain();
      gain.gain.value = 0;

      const filter = S.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 240;
      filter.Q.value = 1.0;

      const osc = S.ctx.createOscillator();
      osc.type = 'sawtooth';        // 거친 배음
      osc.frequency.value = 55;     // A1
      const sub = S.ctx.createOscillator();
      sub.type = 'sine';            // 묵직한 서브
      sub.frequency.value = 27.5;   // A0
      osc.connect(filter);
      sub.connect(filter);

      // 노이즈 한 줌으로 '거칠기' 부여(level로 양 조절).
      let noise = null;
      const noiseGain = S.ctx.createGain();
      noiseGain.gain.value = 0;
      const buf = makeNoiseBuffer();
      if (buf) {
        noise = S.ctx.createBufferSource();
        noise.buffer = buf;
        noise.loop = true;
        const nf = S.ctx.createBiquadFilter();
        nf.type = 'lowpass';
        nf.frequency.value = 400;
        noise.connect(nf);
        nf.connect(noiseGain);
        noiseGain.connect(gain);
        noise.start(t);
      }

      filter.connect(gain);
      gain.connect(S.master);
      osc.start(t);
      sub.start(t);

      S.droneNodes = {
        osc: osc, sub: sub, noise: noise,
        filter: filter, gain: gain, noiseGain: noiseGain,
      };
    }

    // level에 비례해 볼륨/거칠기/밝기 갱신(부드럽게).
    const d = S.droneNodes;
    ramp(d.gain.gain, 0.04 + 0.16 * lv, t, 0.4);     // 볼륨
    if (d.noiseGain) ramp(d.noiseGain.gain, 0.06 * lv, t, 0.4); // 거칠기
    ramp(d.filter.frequency, 180 + 260 * lv, t, 0.4); // 밝기(긴장↑)
  } catch (e) {
    S.droneNodes = null;
  }
}

// 한 번의 'lub-dub' 펄스 2타를 즉시 스케줄(저음 사인 + 빠른 감쇠).
function heartbeatPulse() {
  if (!ready()) return;
  try {
    const t = now();
    // lub(강) → dub(약), 약 0.16초 간격.
    const beats = [
      { at: 0.0,  freq: 55, peak: 0.22 },
      { at: 0.16, freq: 48, peak: 0.15 },
    ];
    for (let i = 0; i < beats.length; i++) {
      const b = beats[i];
      const start = t + b.at;
      const o = S.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(b.freq * 1.6, start);
      o.frequency.exponentialRampToValueAtTime(b.freq, start + 0.06); // 살짝 떨어지는 '쿵'
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(b.peak, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
      o.connect(g);
      g.connect(S.master);
      o.start(start);
      o.stop(start + 0.3); // 자동 해제
    }
  } catch (e) { /* 무음 폴백 */ }
}

// 저(低)기억 심장박동: bpm으로 'lub-dub'를 반복 스케줄. bpm=0이면 정지.
function heartbeat(bpm) {
  // 항상 이전 타이머 정리(중복/누수 방지).
  if (S.heart.timer !== null) {
    clearTimeout(S.heart.timer);
    S.heart.timer = null;
  }
  const rate = (typeof bpm === 'number' && isFinite(bpm)) ? bpm : 0;
  S.heart.bpm = rate;

  if (rate <= 0) return;      // 정지
  if (!ready()) return;       // 컨텍스트 없으면 무음(상태만 보관)

  const periodMs = Math.max(250, 60000 / rate); // 과도한 빈도 방지(상한 240bpm)

  const loop = function () {
    // 정지/뮤트 후 잔여 콜백 안전 처리.
    if (S.heart.bpm <= 0) { S.heart.timer = null; return; }
    heartbeatPulse();
    // bpm이 도중에 바뀌면 다음 주기에 반영.
    const p = Math.max(250, 60000 / S.heart.bpm);
    S.heart.timer = setTimeout(loop, p);
  };

  heartbeatPulse();                          // 즉시 첫 박동
  S.heart.timer = setTimeout(loop, periodMs);
}

// 단발 효과음. name: 'contact' | 'setback' | 'step'.
function sfx(name, opt) {
  if (!ready()) return;
  try {
    const t = now();

    if (name === 'contact') {
      // 피격: 짧은 노이즈 버스트 + 다운피치 톤.
      const buf = makeNoiseBuffer();
      if (buf) {
        const n = S.ctx.createBufferSource();
        n.buffer = buf;
        const nf = S.ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.setValueAtTime(900, t);
        nf.frequency.exponentialRampToValueAtTime(200, t + 0.18); // 다운피치
        const ng = S.ctx.createGain();
        ng.gain.setValueAtTime(0.25, t);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        n.connect(nf); nf.connect(ng); ng.connect(S.master);
        n.start(t);
        n.stop(t + 0.22);
      }
      // 살짝 깔리는 톤으로 충격감 보강.
      const o = S.ctx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.22);

    } else if (name === 'setback') {
      // 후퇴: 저음 역(reverse)스윕 느낌 — 낮은 데서 차오르다 뚝.
      const o = S.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(40, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.7); // 상승 스윕
      const filter = S.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(160, t);
      filter.frequency.exponentialRampToValueAtTime(900, t + 0.7);
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.6);  // 차오름(reverse swell)
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.78); // 급정지
      o.connect(filter); filter.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.85);

    } else if (name === 'step') {
      // 사뿐사뿐 발소리: 아주 부드러운 톤 '톡'(짧은 사인) + 살짝의 소프트 노이즈. opt=음높이 배수(좌우 교차)·vol.
      const pitch = (opt && opt.pitch) || 1, vol = (opt && opt.vol != null) ? opt.vol : 0.06;
      const o = S.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(360 * pitch, t);
      o.frequency.exponentialRampToValueAtTime(220 * pitch, t + 0.06);   // 살짝 떨어지는 '톡'
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      const lp = S.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
      o.connect(lp); lp.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.1);
      const buf = makeNoiseBuffer();                                     // 아주 옅은 '사뿐' 표면음
      if (buf) {
        const n = S.ctx.createBufferSource(); n.buffer = buf;
        const nf = S.ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 2200 * pitch; nf.Q.value = 0.7;
        const ng = S.ctx.createGain();
        ng.gain.setValueAtTime(vol * 0.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
        n.connect(nf); nf.connect(ng); ng.connect(S.master); n.start(t); n.stop(t + 0.05);
      }

    } else if (name === 'hover') {
      // UI 호버: 짧고 맑은 고음 핑(triangle).
      const o = S.ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.05);
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.1);

    } else if (name === 'select') {
      // UI 결정: 두 음 상행(확정감). sine, 부드럽게.
      const freqs = [660, 990];
      freqs.forEach((f, i) => {
        const o = S.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t + i * 0.06);
        const g = S.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + i * 0.06);
        g.gain.exponentialRampToValueAtTime(0.09, t + i * 0.06 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.16);
        o.connect(g); g.connect(S.master);
        o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.18);
      });
    }
    // 알 수 없는 name → 무음(throw 금지).
  } catch (e) { /* 무음 폴백 */ }
}

// ---------------------------------------------------------------------------
// BGM 음악 엔진 — 멜로디가 흐르는 스테이지별 루프 BGM
//
// 설계:
//  - 룩어헤드 스케줄러: setInterval(LOOKAHEAD_MS)로 깨어나 SCHEDULE_AHEAD초
//    앞 구간의 노트를 ctx.currentTime 기준 절대 시각으로 예약 → 타이밍 드리프트 방지.
//  - 각 테마는 스케일/진행/음색/템포를 배열·상수로 정의해 갈아끼우는 구조.
//  - 노트는 ADSR 비슷한 짧은 게인 엔벨로프 + 끝나면 osc.stop()으로 자동 해제(누수 방지).
//  - 테마 전환은 크로스페이드(이전 voice 페이드아웃→정리, 새 voice 페이드인).
//  - 정지·전환 시 interval과 예약된 노드를 반드시 정리.
//  - 음역/볼륨은 ambient/drone과 겹쳐도 뭉개지지 않게 분리(멜로디 중고음, 패드 저음·소volume).
// ---------------------------------------------------------------------------

const MUSIC_MELODY_VOL = 0.075; // 멜로디 노트 피크(0.06~0.09 범위)
const MUSIC_PAD_VOL = 0.035;    // 패드(멜로디보다 작게)
const MUSIC_BASS_VOL = 0.05;    // 저음 드론/펄스
const LOOKAHEAD_MS = 120;       // 스케줄러 깨어나는 주기
const SCHEDULE_AHEAD = 0.9;     // 미리 예약할 구간(초)
const MUSIC_FADE = 1.6;         // 크로스페이드 시간(초)

// 평균율 주파수 헬퍼: A4=440 기준 반음(semitone) 오프셋 → Hz.
function midiHz(semisFromA4) {
  return 440 * Math.pow(2, semisFromA4 / 12);
}

// 테마 정의. 각 테마는 한 '스텝'(시간 격자)마다 어떤 노트를 칠지 패턴 배열로 기술한다.
// patterns의 각 원소: { t: 스텝오프셋, note: 반음(A4=0), dur: 길이초, vol: 0~1, voice: 'mel'|'pad'|'bass', type: 파형 }
// stepDur(초)와 steps(루프 총 스텝수)로 루프 길이를 결정.
//
// 음정 표기(A4=0 기준 반음): A2=-24 A3=-12 C4=-9 D4=-7 E4=-5 F4=-4 G4=-2 A4=0
//   B4=2 C5=3 D5=5 E5=7 F5=8 G5=10 A5=12 ...  (단음계/도리안 위주)
const MUSIC_THEMES = {
  // intro: 매우 희소·저음·거의 앰비언트. 드문 단음 + 낮은 드론. 불안/적막.
  intro: {
    stepDur: 0.95,
    steps: 16,
    melType: 'sine',
    padType: 'sine',
    bassType: 'sine',
    melVol: 0.85,
    padVol: 0.7,
    // A 단조 분위기, 거의 정적. 낮은 드론 패드가 길게 깔리고 멜로디는 드물게.
    patterns: [
      // 길게 깔리는 저음 드론(루트 A2, 5도 E3) — 루프마다 갱신.
      { t: 0,  note: -24, dur: 8.0, vol: 0.9, voice: 'bass', type: 'sine' },     // A2
      { t: 0,  note: -17, dur: 8.0, vol: 0.55, voice: 'pad', type: 'sine' },     // E3
      { t: 8,  note: -24, dur: 7.0, vol: 0.9, voice: 'bass', type: 'sine' },
      { t: 8,  note: -22, dur: 7.0, vol: 0.5, voice: 'pad', type: 'sine' },      // B2(단2도 암시 긴장)
      // 드문 단음(높지 않게). 적막을 깨는 한두 점.
      { t: 3,  note: 0,   dur: 2.2, vol: 0.6, voice: 'mel', type: 'sine' },      // A4
      { t: 10, note: 3,   dur: 2.0, vol: 0.55, voice: 'mel', type: 'sine' },     // C5
      { t: 13, note: -2,  dur: 2.6, vol: 0.5, voice: 'mel', type: 'sine' },      // G4
    ],
  },

  // room(챕터1 방): A 단조. 부드러운 아르페지오 + 따뜻하지만 쓸쓸한 멜로디 + 낮은 패드. 잔잔.
  room: {
    stepDur: 0.34,
    steps: 32,
    melType: 'triangle',
    padType: 'sine',
    bassType: 'sine',
    melVol: 1.0,
    padVol: 0.8,
    // 흐르는 8분음 아르페지오(Am - F - C - G 풍 진행)를 한 마디 8스텝씩.
    patterns: [

// 한 노트를 ctx 절대시각 startAbs에 스케줄. voice 종류별 음색/엔벨로프/필터를 분리.
// 생성한 노드는 자동 stop되며, voice.scheduled에 등록해 강제 정리(전환/정지)에도 대비.
function scheduleNote(voice, p, startAbs) {
  if (!ready()) return;
  try {
    const def = voice.def;
    const hz = midiHz(p.note);
    const dur = p.dur;
    const o = S.ctx.createOscillator();
    o.type = p.type || (p.voice === 'pad' ? def.padType : p.voice === 'bass' ? def.bassType : def.melType);
    o.frequency.value = hz;

    const g = S.ctx.createGain();

    // voice별 음역 분리용 로우/하이 필터 + 볼륨 스케일.
    let peak;
    let attack, release;
    let outNode = g;
    if (p.voice === 'pad') {
      peak = MUSIC_PAD_VOL * (p.vol != null ? p.vol : 1) * (def.padVol || 1);
      attack = Math.min(0.8, dur * 0.35);
      release = Math.min(2.5, dur * 0.6);
      const lp = S.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 700;     // 패드는 어둡게(멜로디와 음색 분리)
      lp.Q.value = 0.5;
      o.connect(lp);
      lp.connect(g);
    } else if (p.voice === 'bass') {
      peak = MUSIC_BASS_VOL * (p.vol != null ? p.vol : 1);
      attack = Math.min(0.05, dur * 0.2);
      release = Math.min(0.5, dur * 0.5);
      const lp = S.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 220;     // 저음만
      o.connect(lp);
      lp.connect(g);
    } else { // 'mel'
      peak = MUSIC_MELODY_VOL * (p.vol != null ? p.vol : 1) * (def.melVol || 1);
      attack = 0.02;
      release = Math.min(0.9, dur * 0.7);
      const hp = S.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 180;     // 멜로디는 저음과 분리(중고음역)
      o.connect(hp);
      hp.connect(g);
    }
    if (peak <= 0) peak = 0.0001;

    // ADSR 비슷한 엔벨로프(클릭 방지 위해 0.0001부터).
    const t0 = startAbs;
    const tEnd = startAbs + dur;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    g.gain.setValueAtTime(peak, Math.max(t0 + attack, tEnd - release));
    g.gain.exponentialRampToValueAtTime(0.0001, tEnd);

    g.connect(voice.bus);
    o.start(t0);
    o.stop(tEnd + 0.05); // 끝나면 자동 해제(누수 방지)

    // 강제 정리 대비 추적(완료된 노드는 onended에서 제거).
    const entry = { o: o, g: g };
    voice.scheduled.push(entry);
    o.onended = function () {
      try { o.disconnect(); } catch (e) { /* no-op */ }
      try { g.disconnect(); } catch (e) { /* no-op */ }
      const idx = voice.scheduled.indexOf(entry);
      if (idx >= 0) voice.scheduled.splice(idx, 1);
    };
  } catch (e) { /* 무음 폴백 */ }
}

// 한 voice의 룩어헤드 틱: nextTime 이전(SCHEDULE_AHEAD 이내)에 들어오는 모든 노트를 예약.
function musicTick(voice) {
  if (!ready()) { return; }
  const def = voice.def;
  const loopDur = def.steps * def.stepDur;
  const horizon = now() + SCHEDULE_AHEAD;

  // nextTime: 다음에 예약할 절대 시각. step: 현재 루프 내 스텝 위치(정수 진행).
  while (voice.nextTime < horizon) {
    const loopStart = voice.nextTime - (voice.step * def.stepDur);
    // 이번 스텝에 시작하는 모든 패턴 노트 예약.
    for (let i = 0; i < def.patterns.length; i++) {
      const p = def.patterns[i];
      if (p.t === voice.step) {
        scheduleNote(voice, p, voice.nextTime);
      }
    }
    voice.step += 1;
    voice.nextTime += def.stepDur;
    if (voice.step >= def.steps) {
      voice.step = 0; // 루프 반복(nextTime은 그대로 이어져 드리프트 없음)
      // loopStart 사용 안 함(연속 진행). 변수는 가독성 참고용.
      void loopStart;
    }
  }
}

// voice 하나를 완전히 정리(interval + 예약 노드 + 버스).
function teardownVoice(voice, fadeOut) {
  if (!voice) return;
  if (voice.timer !== null) {
    clearInterval(voice.timer);
    voice.timer = null;
  }
  const t = now();
  try {
    if (voice.bus) {
      if (fadeOut) {
        ramp(voice.bus.gain, 0, t, MUSIC_FADE);
      } else {
        ramp(voice.bus.gain, 0, t, 0.05);
      }
    }
  } catch (e) { /* no-op */ }
  const killAt = t + (fadeOut ? MUSIC_FADE : 0.05);
  // 예약된 노드 강제 정리(페이드 후).
  const sched = voice.scheduled.slice();
  for (let i = 0; i < sched.length; i++) {
    stopNode(sched[i].o, killAt + 0.05);
    stopNode(sched[i].g, killAt + 0.05);
  }
  voice.scheduled.length = 0;
  // 버스도 페이드 끝나면 끊기.
  const bus = voice.bus;
  if (bus) {
    setTimeout(function () {
      try { bus.disconnect(); } catch (e) { /* no-op */ }
    }, (fadeOut ? MUSIC_FADE : 0.05) * 1000 + 120);
  }
}

// 새 테마 voice를 생성·시작(페이드인 + 스케줄러 가동).
function startVoice(theme) {
  const def = MUSIC_THEMES[theme];
  if (!def || !ready()) return null;
  try {
    const bus = S.ctx.createGain();
    bus.gain.value = 0.0001;
    bus.connect(S.master);
    const t = now();
    ramp(bus.gain, 1, t, MUSIC_FADE); // 버스 자체는 1까지(노트 볼륨은 노트별로 작게)

    const voice = {
      theme: theme,
      def: def,
      bus: bus,
      timer: null,
      scheduled: [],
      step: 0,
      nextTime: now() + 0.12, // 살짝 앞에서 시작
    };

    musicTick(voice); // 즉시 첫 구간 예약
    voice.timer = setInterval(function () {
      // 컨텍스트가 죽으면 안전 정지.
      if (!ready()) { teardownVoice(voice, false); return; }
      musicTick(voice);
    }, LOOKAHEAD_MS);

    return voice;
  } catch (e) {
    return null;
  }
}

// 공개 API: 스테이지별 루프 멜로디 BGM. theme 전환 시 크로스페이드, null/'stop'이면 정지.
function music(theme) {
  // 정규화.
  if (theme === 'stop') theme = null;

  // 컨텍스트 없으면 상태만 보관하고 무음 폴백(throw 금지).
  if (!ready()) {
    S.music.theme = theme;
    return;
  }

  // 같은 테마 재요청 → 무시(중복 생성 방지).
  if (theme === S.music.theme && S.music.voices.length > 0) return;

  // 정지 또는 전환: 기존 voice 전부 페이드아웃 정리.
  const old = S.music.voices.slice();
  S.music.voices.length = 0;
  for (let i = 0; i < old.length; i++) {
    teardownVoice(old[i], true);
  }

  S.music.theme = theme;
  if (!theme) return; // 정지면 여기서 끝.

  // 알 수 없는 테마 → 무음(throw 금지).
  if (!MUSIC_THEMES[theme]) return;

  const voice = startVoice(theme);
  if (voice) S.music.voices.push(voice);
}

const Audio2 = {
  init: init,
  setMuted: setMuted,
  toggleMute: toggleMute,
  ambient: ambient,
  chime: chime,
  drone: drone,
  heartbeat: heartbeat,
  heartbeatPulse: heartbeatPulse,
  sfx: sfx,
  music: music,
};

if (typeof window !== 'undefined') window.Audio2 = Audio2;

</script>
<script>
/* ===== journal.js ===== */
// =============================================================================
// journal.js — 『잊혀진 발자국』(지로 Ziro) 기억 일지 · 정체성 카드 오버레이 모듈
// -----------------------------------------------------------------------------
// 순수 그리기(렌더) 전용. 상태(st)·인자 절대 변경 금지(읽기 전용).
// main.js 가 phase==='journal' 일 때 매 프레임 Journal.draw(...) 호출.
// 호출 시점에 ctx.setTransform(1,0,0,1,0,0) 로 초기화돼 있음 →
//   캔버스 픽셀 좌표(cv.width × cv.height, 예 1056×672) 기준으로 그린다.
//
// API: Journal.draw(ctx, cv, st, DATA, IMG)
//   ctx  : CanvasRenderingContext2D (transform 초기화 상태)
//   cv   : canvas (cv.width / cv.height 사용)
//   st   : { mem, light, identity(0..5), coresNeeded, collected(Set),
//            coreOrder(Array), sealed(Set) }   ← 읽기 전용
//   DATA : DATA.chapter1 또는 챕터 형태 객체 ({ shards, identityLabels })
//   IMG  : 로드된 이미지 맵 (IMG.ziro_d0 등)
//
// 디자인 시스템 색 토큰(00_design_review / mockups 준수):
//   배경 dim rgba(4,7,11,.92) · 패널 #0a1014 · 라인 #1d3236
//   시안 #34e2e2(중립) · 연두 #8ef548(해금/긍정) · 위험 #ff5a5a
//   텍스트 #eafaff(주) / #8aa7a9(보조) / #5a7375(잠금)
//   거짓(false) 단서 강조 #caa15a
//   폰트 'Noto Sans KR',sans-serif
// =============================================================================

const Journal = (function () {
  "use strict";

  // ---- 색 토큰 ----------------------------------------------------------------
  var COL = {
    dim:      "rgba(4,7,11,.92)",
    panel:    "#0a1014",
    panelDk:  "#080c0f",   // 잠긴 칸(더 어두운 패널)
    panelHi:  "#10262a",   // 해금 칸 배경(시안 톤)
    line:     "#1d3236",
    lineDk:   "#243036",   // 잠긴 칸 테두리
    cyan:     "#34e2e2",   // 중립
    cyanDk:   "#2a6e72",   // 해금 칸 테두리(시안 톤 다운)
    lime:     "#8ef548",   // 해금/긍정
    danger:   "#ff5a5a",
    text:     "#eafaff",
    textSub:  "#8aa7a9",
    lock:     "#5a7375",   // 잠금 텍스트
    lockIcon: "#3a5557",   // 자물쇠 형태
    falseGold:"#caa15a",   // false 단서
    falseTxt: "#e8c884",   // false 텍스트(밝게)
    falsePnl: "#1a1408",   // false 패널
    falseLn:  "#3a2a14",   // false 테두리
    echo:     "#8aa7a9",   // echo 타입(보조 회색)
    portBg:   "#0e0f13",   // 초상 셀 배경
    portDk:   "#0a0d0f",   // 잠긴 초상 셀 배경
  };
  var FONT = "'Noto Sans KR',sans-serif";

  // ---- 그리기 헬퍼 ------------------------------------------------------------
  function rrect(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    if (r < 0) r = 0;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 한 줄 말줄임(…) — maxw(px) 초과 시 잘라 '…' 부착. ctx.font 은 호출 전에 설정.
  function ellipsize(ctx, text, maxw) {
    text = (text == null ? "" : String(text));
    if (ctx.measureText(text).width <= maxw) return text;
    var ell = "…";
    var ellW = ctx.measureText(ell).width;
    if (maxw <= ellW) return ell;
    var lo = 0, hi = text.length, best = "";
    // 이진 탐색으로 들어가는 최대 글자 수 찾기
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var cand = text.slice(0, mid);
      if (ctx.measureText(cand).width + ellW <= maxw) { best = cand; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best.replace(/\s+$/, "") + ell;
  }

  // 자물쇠 아이콘(걸쇠 + 몸통). cx,cy = 자물쇠 몸통 중앙 근처, s = 크기 배수.
  function lockIcon(ctx, cx, cy, s, color) {
    s = s || 1;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3 * s;
    // 걸쇠(U자)
    var shW = 10 * s;     // 걸쇠 폭
    var shTop = cy - 9 * s;
    ctx.beginPath();
    ctx.moveTo(cx - shW / 2, cy - 1 * s);
    ctx.lineTo(cx - shW / 2, shTop + shW / 2);
    ctx.arc(cx, shTop + shW / 2, shW / 2, Math.PI, 0);
    ctx.lineTo(cx + shW / 2, cy - 1 * s);
    ctx.stroke();
    // 몸통
    var bw = 18 * s, bh = 14 * s;
    rrect(ctx, cx - bw / 2, cy - 1 * s, bw, bh, 3 * s);
    ctx.fill();
    ctx.restore();
  }

  // 체크(✓) 마크
  function checkMark(ctx, x, y, size, color) {
    ctx.save();
    ctx.font = "bold " + size + "px " + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("✓", x, y);
    ctx.restore();
  }

  // ---- 초상 진화 셀(원형) -----------------------------------------------------
  // stage: 0=? 1=실루엣 2=눈 3=얼굴 4=이름.  active: 또렷 여부.
  // nameReveal: 이름(stage 4)을 공개할지(정체성===5일 때만 true). 이름은 최종 보상.
  function portraitCell(ctx, cx, cy, r, stage, active, IMG, nameReveal) {
    ctx.save();

    // 배경 원
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? COL.portBg : COL.portDk;
    ctx.fill();

    // 테두리: 활성도에 따라 시안 → 라인
    ctx.lineWidth = 2;
    ctx.strokeStyle = active ? (stage >= 3 ? COL.cyan : "#2a4a4e") : COL.line;
    if (stage === 4) { ctx.setLineDash([4, 5]); }   // 이름 단계는 점선(미완)
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 비활성 셀은 클립 안에서 흐리게 그림
    var fg = active ? 1 : 0.28;

    // 셀 내부를 원으로 클립(그림이 원 밖으로 새지 않게)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
    ctx.clip();

    var silCol = active ? "#1a2228" : "#12181c";
    var eyeCol = active ? COL.lime : "#3a4a30";

    if (stage === 0) {
      // ? 물음표
      ctx.globalAlpha = fg;
      ctx.fillStyle = active ? COL.cyan : COL.lock;
      ctx.font = "bold " + Math.round(r * 0.95) + "px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", cx, cy + 1);
    } else if (stage === 1) {
      // 실루엣: 귀 두 개 + 머리 타원
      ctx.globalAlpha = fg;
      ctx.fillStyle = silCol;
      // 귀
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.62, cy - r * 0.10);
      ctx.lineTo(cx - r * 0.34, cy - r * 0.82);
      ctx.lineTo(cx - r * 0.08, cy - r * 0.16);
      ctx.closePath();
      ctx.moveTo(cx + r * 0.62, cy - r * 0.10);
      ctx.lineTo(cx + r * 0.34, cy - r * 0.82);
      ctx.lineTo(cx + r * 0.08, cy - r * 0.16);
      ctx.closePath();
      ctx.fill();
      // 머리
      ctx.beginPath();
      ctx.ellipse(cx, cy + r * 0.12, r * 0.72, r * 0.64, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 2) {
      // 눈 두 개(빛남)
      ctx.globalAlpha = fg;
      ctx.fillStyle = eyeCol;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.32, cy, r * 0.26, r * 0.33, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + r * 0.32, cy, r * 0.26, r * 0.33, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 3) {
      // 얼굴: 가능하면 IMG.ziro_d0 사용, 없으면 절차적 얼굴
      var im = IMG && IMG.ziro_d0;
      if (im && im.width) {
        ctx.globalAlpha = fg;
        var prevSmooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;   // 픽셀아트 또렷하게
        // 원 안에 맞춰 비율 유지 스케일
        var box = r * 1.7;
        var scale = Math.min(box / im.width, box / im.height);
        var dw = im.width * scale, dh = im.height * scale;
        ctx.drawImage(im, Math.round(cx - dw / 2), Math.round(cy - dh / 2), Math.round(dw), Math.round(dh));
        ctx.imageSmoothingEnabled = prevSmooth;
      } else {
        // 절차적 얼굴(귀 + 눈 + 입)
        ctx.globalAlpha = fg;
        ctx.fillStyle = "#0d0d10";
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.72, cy - r * 0.18);
        ctx.lineTo(cx - r * 0.38, cy - r * 0.92);
        ctx.lineTo(cx - r * 0.08, cy - r * 0.22);
        ctx.closePath();
        ctx.moveTo(cx + r * 0.72, cy - r * 0.18);
        ctx.lineTo(cx + r * 0.38, cy - r * 0.92);
        ctx.lineTo(cx + r * 0.08, cy - r * 0.22);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = active ? COL.cyan : "#2a4a4e";
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.62, cy - r * 0.30);
        ctx.lineTo(cx - r * 0.40, cy - r * 0.78);
        ctx.lineTo(cx - r * 0.20, cy - r * 0.30);
        ctx.closePath();
        ctx.moveTo(cx + r * 0.62, cy - r * 0.30);
        ctx.lineTo(cx + r * 0.40, cy - r * 0.78);
        ctx.lineTo(cx + r * 0.20, cy - r * 0.30);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = eyeCol;
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.34, cy + r * 0.04, r * 0.30, r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + r * 0.34, cy + r * 0.04, r * 0.30, r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = active ? COL.cyan : "#2a4a4e";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.17, cy + r * 0.5);
        ctx.quadraticCurveTo(cx, cy + r * 0.66, cx + r * 0.17, cy + r * 0.5);
        ctx.stroke();
      }
    } else if (stage === 4) {
      // 이름 단계: 이름은 최종 보상 → 정체성===5(nameReveal)일 때만 'ZIRO' 공개.
      // 그 전(active여도)에는 '?'로 가린다.
      ctx.globalAlpha = fg;
      ctx.fillStyle = nameReveal ? COL.lime : (active ? COL.cyan : COL.lock);
      ctx.font = "bold " + Math.round(nameReveal ? r * 0.5 : r * 0.95) + "px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(nameReveal ? "ZIRO" : "?", cx, cy);
    }

    ctx.restore(); // 클립 해제
    ctx.restore();
  }

  // ---- 메인 그리기 ------------------------------------------------------------
  function draw(ctx, cv, st, DATA, IMG, meta) {
    if (!ctx || !cv) return;
    meta = meta || {};
    var journeyStages = meta.stages || null;
    var clearedCount = 0;
    if (journeyStages) for (var jj = 0; jj < journeyStages.length; jj++) if (journeyStages[jj].cleared) clearedCount++;

    // --- 인자 정규화(읽기 전용 복사 없이 안전 참조) -------------------------
    st = st || {};
    var W = cv.width, H = cv.height;

    // DATA 가 루트인지 챕터 형태인지 유연 처리
    var chap = (DATA && DATA.chapter1) ? DATA.chapter1 : (DATA || {});
    var shards = (chap && chap.shards) || [];
    var labels = (chap && chap.identityLabels) || [];

    var identity   = (typeof st.identity === "number") ? st.identity : 0;
    var coresNeed  = (typeof st.coresNeeded === "number") ? st.coresNeeded : (chap.coresNeeded || 0);
    // coreOrder 길이(획득 코어 수). 없으면 collected 내 core 개수로 폴백.
    var coreCount;
    if (st.coreOrder && typeof st.coreOrder.length === "number") {
      coreCount = st.coreOrder.length;
    } else {
      coreCount = 0;
      for (var ci = 0; ci < shards.length; ci++) {
        if (shards[ci].type === "core" && collectedHas(st, shards[ci].id)) coreCount++;
      }
    }

    // collected 멤버십(Set 우선, 배열 폴백)
    function collectedHas(state, id) {
      var c = state.collected;
      if (!c) return false;
      if (typeof c.has === "function") return c.has(id);
      if (typeof c.indexOf === "function") return c.indexOf(id) >= 0;
      return false;
    }

    ctx.save();
    ctx.textBaseline = "alphabetic";

    // === 0. 전체 dim 배경 =====================================================
    ctx.fillStyle = COL.dim;
    ctx.fillRect(0, 0, W, H);

    // 바깥 여백 / 레이아웃 기준
    var PAD = Math.round(W * 0.038);          // 좌우 바깥 여백
    if (PAD < 28) PAD = 28;
    var contentX = PAD;
    var contentW = W - PAD * 2;

    // === 1. 제목 ==============================================================
    var titleY = Math.round(H * 0.082);
    ctx.textAlign = "left";
    ctx.fillStyle = COL.text;
    ctx.font = "800 32px " + FONT;
    ctx.fillText("기억 일지 · 정체성", contentX, titleY);
    ctx.fillStyle = COL.cyan;
    ctx.font = "14px " + FONT;
    ctx.fillText("MEMORY JOURNAL · IDENTITY", contentX + 2, titleY + 22);
    // 우상단 진행 표기(정체성 n/5 + 여정 N/총)
    ctx.textAlign = "right";
    ctx.fillStyle = COL.lime;
    ctx.font = "700 20px " + FONT;
    ctx.fillText(identity + " / 5 복원", W - PAD, titleY);
    if (journeyStages) { ctx.fillStyle = COL.cyan; ctx.font = "13px " + FONT;
      ctx.fillText("여정 " + clearedCount + " / " + journeyStages.length, W - PAD, titleY + 20); }

    // === 2. 초상 진화 행 ======================================================
    // 5개 원형 셀(? → 실루엣 → 눈 → 얼굴 → 이름). identity 단계까지 또렷.
    var rowY = titleY + 58;
    ctx.textAlign = "left";
    ctx.fillStyle = COL.textSub;
    ctx.font = "14px " + FONT;
    ctx.fillText("기억이 차오를수록 또렷해진다", contentX, rowY);

    var cellR = 34;
    var cyCell = rowY + 18 + cellR;
    var nCells = 5;
    // 셀 사이 간격을 contentW 안에 균등 분배
    var span = contentW - cellR * 2;
    var gap = (nCells > 1) ? span / (nCells - 1) : 0;
    var firstCx = contentX + cellR;

    for (var s = 0; s < nCells; s++) {
      var cx = Math.round(firstCx + gap * s);
      // 현재 identity 단계까지 또렷. identity=0 이면 첫 셀(?)만 약하게 활성.
      // 매핑: 셀 s 는 "정체성이 s단계 이상이면 또렷".
      //   identity=0 → 아무 단계도 완성 안 됨이지만, ?(stage0)는 항상 보이는 시작점.
      var active = (s === 0) ? true : (identity >= s);
      // identity 가 그 단계'에 도달'했을 때만 또렷: s번째 셀은 identity>=s.
      // 이름 셀(s===4)은 정체성===5 일 때만 공개(nameReveal).
      var nameReveal = (s === 4) && (identity >= 5);
      portraitCell(ctx, cx, cyCell, cellR, s, active, IMG, nameReveal);

      // 셀 사이 화살표(›)
      if (s < nCells - 1) {
        var ax = Math.round(cx + gap / 2);
        ctx.fillStyle = "#2a4a4e";
        ctx.font = "22px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText("›", ax, cyCell + 7);
        ctx.textAlign = "left";
      }
    }
    // 단계 캡션
    var capNames = ["?", "실루엣", "눈", "얼굴", "이름"];
    ctx.fillStyle = COL.lock;
    ctx.font = "12px " + FONT;
    ctx.textAlign = "center";
    for (var cap = 0; cap < nCells; cap++) {
      var capx = Math.round(firstCx + gap * cap);
      ctx.fillStyle = ((cap === 0) || identity >= cap) ? COL.textSub : COL.lock;
      ctx.fillText(capNames[cap], capx, cyCell + cellR + 18);
    }

    // === 2열 패널 영역(좌: 정체성 / 우: 기억 목록) ============================
    var colsTop = cyCell + cellR + 34;
    var bottomReserve = journeyStages ? 132 : 96;   // 하단 여정 스트립 + 푸터 공간
    var colsH = H - colsTop - bottomReserve;
    if (colsH < 120) colsH = 120;
    var colGap = Math.round(W * 0.024);
    if (colGap < 18) colGap = 18;
    var leftW = Math.round((contentW - colGap) * 0.5);
    var rightW = contentW - colGap - leftW;
    var leftX = contentX;
    var rightX = contentX + leftW + colGap;

    // --- 좌 패널 배경 ---
    ctx.fillStyle = COL.panel;
    rrect(ctx, leftX, colsTop, leftW, colsH, 14); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
    rrect(ctx, leftX, colsTop, leftW, colsH, 14); ctx.stroke();
    // --- 우 패널 배경 ---
    ctx.fillStyle = COL.panel;
    rrect(ctx, rightX, colsTop, rightW, colsH, 14); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
    rrect(ctx, rightX, colsTop, rightW, colsH, 14); ctx.stroke();

    // === 3. 정체성 5슬롯 (좌 패널) ===========================================
    var lInX = leftX + 20;
    var lInW = leftW - 40;
    ctx.textAlign = "left";
    ctx.fillStyle = COL.lime;
    ctx.font = "700 17px " + FONT;
    ctx.fillText("정체성 카드", lInX, colsTop + 30);

    var slotTop = colsTop + 48;
    var slotN = 5;
    var slotGap = 12;
    var slotH = Math.floor((colsH - 48 - 20 - slotGap * (slotN - 1)) / slotN);
    if (slotH > 70) slotH = 70;
    if (slotH < 44) slotH = 44;

    // 정체성 슬롯의 "해금" 규칙: i < identity 이면 해금(연두 ✓), 아니면 잠금.
    // 이름 슬롯(index 3)은 identity<5 이면 'ZIRO'를 '?????'로 가림.
    var NAME_SLOT = 3;
    for (var i = 0; i < slotN; i++) {
      var sy = slotTop + i * (slotH + slotGap);
      var unlocked = (i < identity);
      var label = labels[i] != null ? String(labels[i]) : ("슬롯 " + (i + 1));

      // 패널
      if (unlocked) {
        ctx.fillStyle = COL.panelHi;
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.fill();
        ctx.strokeStyle = COL.cyanDk; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.stroke();
      } else {
        ctx.fillStyle = COL.panelDk;
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.fill();

    for (const s of shards) {
      if (isDone(s)) continue;
      if (s.hidden && !illuminated.has(s.id)) continue;   // 숨은 조각은 비출 때만
      if (dist(player.x, player.y, shardCenter(s).x, shardCenter(s).y) < (s.radius||1.3) * TILE) { nearShard = s; break; }
    }
    if (edge["e"] && nearShard) doCollect(nearShard);

    // 직감(H) — 빛 소모 없이, 지금 무엇을 해야 하는지 한 줄만 알려준다(목표 알림). 위치는 안 보여줌.
    if (edge["h"]) {
      const got = st.coreOrder ? st.coreOrder.length : 0;
      hintMsg = (got >= st.coresNeeded) ? "충분해… 이제 출구를 찾자." : "아직 찾아야 할 기억이 남아있는 것 같다…";
      hintMsgT = 3.4;
    }
    if (hintMsgT > 0) hintMsgT -= dt;

    // 음소거
    if (edge["m"] && window.Audio2) { muted = !muted; Audio2.setMuted(muted); }

    // 위험 오디오
    if (window.Audio2) { Audio2.drone(danger ? 0.8 : 0); Audio2.heartbeat(st.mem <= 2 ? 96 : 0); }

    // 보스(공백) 상태기계 — idle(취약·비추기 가능) → charge(망각 파동 예고) → burst(근접 피해)
    if (boss) {
      boss.t += dt; if (boss.hit > 0) boss.hit -= dt; if (boss.ringT > 0) boss.ringT -= dt;
      if (!boss.dispelled) {
        boss.timer -= dt;
        if (boss.phase === "idle" && boss.timer <= 0) { boss.phase = "charge"; boss.timer = 0.85; }
        else if (boss.phase === "charge" && boss.timer <= 0) {           // 파동 터짐: 근접 시 기억 피해
          boss.phase = "idle"; boss.timer = 1.7; boss.ringT = 0.5;
          if (dist(player.x, player.y, boss.x, boss.y) < boss.waveR && projInvuln <= 0) {
            if (Core.contact(st)) { flash = 0.22; shake = 6; if (window.Audio2) Audio2.sfx("contact"); }
          } else if (window.Audio2 && Audio2.chime) Audio2.chime();      // 빗나감
        }
      }
      if (boss.dispelled) { boss.exitT -= dt; if (boss.exitT <= 0) { beginRealize(); clearEdges(); return; } }
    }
    // 클리어 → 깨달음(회상 몽타주) → (최종) 선택/엔딩 또는 다음 챕터 전환
    if (!boss && Core.chapterClear(st) && door && dist(player.x, player.y, door.x, door.y) < 14) beginRealize();

    updateCamera();   // 플레이어 이동 후 카메라 추적
    updateAmbient(dt);
    if (stageCardT > 0) stageCardT -= dt;
    if (collectFx) { collectFx.t -= dt; if (collectFx.t <= 0) collectFx = null; }
    if (flash > 0) flash -= dt; if (shake > 0) shake -= dt * 24;
    if (veil > 0) veil = Math.max(0, veil - dt);   // 방 진입 페이드인
    if (corePulse > 0) corePulse -= dt;
    for (const t of toasts) t.t -= dt; toasts = toasts.filter(t => t.t > 0);
    clearEdges();
  }

  let nearShard = null;

  function moveAxis(axis, d) {
    if (!d) return;
    if (axis === "x") { player.x += d; const r = inAny(player.x, player.y, player.w, player.h, colls); if (r) player.x = d > 0 ? r.x - player.w/2 : r.x + r.w + player.w/2; }
    else { player.y += d; const r = inAny(player.x, player.y, player.w, player.h, colls); if (r) player.y = d > 0 ? r.y - player.h/2 : r.y + r.h + player.h/2; }
  }

  function doCollect(s) {
    const res = Core.collect(st, s) || {};
    if (res.ok === false) return;
    recall = { text: res.recallText || s.recall || "", type: res.type || s.type };
    phase = "recall";
    const cc = shardCenter(s); collectFx = { x: cc.x, y: cc.y, type: s.type, t: 0.55 };   // 수집 링 FX
    if (s.type === "false") { flash = 0.18; shake = 4; }
    if (s.type === "core") {
      toasts.push({ text: "코어 기억 " + st.coreOrder.length + " / " + st.coresNeeded + " 회복!", color: "#8ef548", t: 2.4 });
      corePulse = 0.7;
      if (Core.chapterClear(st)) toasts.push({ text: "문이 열렸다 — 위쪽 ↑ 으로", color: "#34e2e2", t: 3.4 });
    } else if (s.type === "echo") toasts.push({ text: "에코 기억 — 옛 흔적을 떠올렸다", color: "#9fc5c5", t: 2.0 });
    else if (s.type === "false") toasts.push({ text: "⚠ 거짓된 기억 — 기억이 깎였다", color: "#ff7a7a", t: 2.6 });
    if (window.Audio2) { if (s.type === "false") Audio2.sfx("contact"); else Audio2.chime(); }
  }
  function closeRecall() { recall = null; phase = "play"; }

  // ── 렌더 ──────────────────────────────────────────────────
  function spriteFor() {
    if (player.facing === "side") return player.frame ? IMG.ziro_s1 : IMG.ziro_s0;
    if (!player.frame) return IMG.ziro_d0;                  // idle
    return ((player.step||0) & 1) ? IMG.ziro_d2 : IMG.ziro_d1;  // 보행 두 프레임 교차
  }

  function draw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    const shk = reduceFlash ? 0 : Math.max(0, shake);   // 접근성: 화면 흔들림 감소
    const sx = (Math.random() - 0.5) * 2 * shk, sy = (Math.random() - 0.5) * 2 * shk;
    ctx.scale(S, S); ctx.translate(-camX + sx, -camY + sy);   // 카메라 오프셋 적용

    if (!ready) { ctx.restore(); hudText("로딩…", cv.width/2, cv.height/2, "#34e2e2", 20, true); return; }

    // 배경 — 현재 챕터의 bgKey(room1/room2/room3) 사용
    const bg = IMG[D.bgKey] || IMG.room1;
    if (bg && bg.width) ctx.drawImage(bg, 0, 0, NW, NH);
    else { ctx.fillStyle = "#10140d"; ctx.fillRect(0, 0, NW, NH); }

    // 문(클리어 가능 시 빛남)
    if (door && Core.chapterClear(st)) {
      ctx.save(); ctx.globalAlpha = 0.6 + 0.3*Math.sin(performance.now()/200);
      ctx.fillStyle = "#34e2e2"; ctx.fillRect(door.x-7, door.y-7, 14, 14); ctx.restore();
    }

    // 발자국 추적 흔적
    for (const p of trail) { const a = 1 - p.age / C.TRAIL_LIFE; ctx.save(); ctx.globalAlpha = 0.55 * a; ctx.fillStyle = "#34e2e2";
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 1, 2.2, 1.6, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x - 1.6, p.y - 1.6, 0.8, 0, 7); ctx.arc(p.x + 1.6, p.y - 1.6, 0.8, 0, 7); ctx.fill(); ctx.restore(); }
    // 기억 비추기 펄스 — 확장하는 빛 고리(그림자를 밀어냄)
    if (auraFx > 0) {
      const f = auraFx / 0.6, t = 1 - f, ar = AURA_R * (0.45 + 0.75 * t), cyx = player.x, cyy = player.y - 2;
      ctx.save();
      const g = ctx.createRadialGradient(cyx, cyy, 3, cyx, cyy, ar);
      g.addColorStop(0, "rgba(154,246,246," + (0.32 * f) + ")"); g.addColorStop(0.7, "rgba(52,226,226," + (0.13 * f) + ")"); g.addColorStop(1, "rgba(52,226,226,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cyx, cyy, ar, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.8 * f; ctx.strokeStyle = "#9af6f6"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cyx, cyy, ar, 0, 7); ctx.stroke();
      ctx.restore();
    }

    // 환경 단서: 미발견 조각을 거리 비례로 흐릿하게(글로우 OFF 보완 — '여기 뭔가 있다').
    //   숨은 조각은 제외(Q로만). 모든 조각이 동일하게 보인다 — 진짜·에코·거짓은
    //   조사([E])해야만 구분된다(거짓을 미리 알고 무시하지 못하도록).
    for (const s of shards) {
      if (isDone(s) || s.hidden) continue;
      const c = shardCenter(s), d = dist(player.x, player.y, c.x, c.y);
      if (d > 120) continue;
      const a = Math.max(0.1, Math.min(0.55, 1 - d / 120)) * (0.6 + 0.4 * Math.sin(performance.now() / 320));
      ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "#34e2e2"; ctx.shadowBlur = 5;
      ctx.fillStyle = "#34e2e2";
      ctx.beginPath(); ctx.arc(c.x, c.y - 1, 2.6, 0, 7); ctx.fill(); ctx.restore();
    }
    // 페어 물건 — obj 조각은 그 물건을 기억과 함께 표시(랜덤 배치돼도 '그 물건 이야기'가 유지됨)
    for (const s of shards) {
      if (isDone(s) || !s.obj) continue;
      if (s.hidden && !illuminated.has(s.id)) continue;
      const c = shardCenter(s); drawObj(s.obj, c.x, c.y + 4);
    }

    // 보스 '공백(The Blank)' — 거대한 자아 그림자. 코어 3 모으면 비추기로 해소(가벼운 연출형).
    if (boss && !boss.dispelled) {
      const ready = Core.chapterClear(st), r = 16 * (boss.hp / boss.max) + 12, pul = 0.5 + 0.5*Math.sin(boss.t*2.2);
      ctx.save();
      const g = ctx.createRadialGradient(boss.x, boss.y, 2, boss.x, boss.y, r+22);
      g.addColorStop(0, "rgba(18,14,32,0.96)"); g.addColorStop(0.55, "rgba(30,22,52,0.7)"); g.addColorStop(1, "rgba(18,14,32,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(boss.x, boss.y, r+22, 0, 7); ctx.fill();
      ctx.fillStyle = "#191228";
      for (const [ox, oy, rr] of [[0,0,r],[-r*0.5,2,r*0.6],[r*0.5,1,r*0.6],[0,-r*0.5,r*0.55]])   // 뭉치는 그림자
        { ctx.beginPath(); ctx.arc(boss.x+ox, boss.y+oy + Math.sin(boss.t*3+ox)*1.5, rr, 0, 7); ctx.fill(); }
      ctx.fillStyle = ready ? "#caa1ff" : "#7a5cff";                                              // 눈
      ctx.beginPath(); ctx.ellipse(boss.x-6, boss.y-3, 2.3, 3.4, 0, 0, 7); ctx.ellipse(boss.x+6, boss.y-3, 2.3, 3.4, 0, 0, 7); ctx.fill();
      if (ready && boss.phase === "idle") { ctx.globalAlpha = 0.4 + 0.45*pul; ctx.strokeStyle = "#9af6f6"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(boss.x, boss.y, r+20, 0, 7); ctx.stroke(); }
      // 망각 파동 예고(charge): 보스 둘레 위험 반경이 붉게 차오름 → 이 안에 있으면 피해
      if (boss.phase === "charge") {
        const k = 1 - boss.timer / 0.85;
        ctx.globalAlpha = 0.18 + 0.22 * k; ctx.fillStyle = "#ff5a5a";
        ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.waveR, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.5 + 0.4 * Math.sin(boss.t * 30); ctx.strokeStyle = "#ff7a7a"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.waveR, 0, 7); ctx.stroke();
      }
      // 파동 터짐 링(밖으로 확장)
      if (boss.ringT > 0) { const e = 1 - boss.ringT / 0.5; ctx.globalAlpha = boss.ringT / 0.5 * 0.7;
        ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.waveR * (0.7 + 0.8*e), 0, 7); ctx.stroke(); }
      if (boss.hit > 0) { ctx.globalAlpha = Math.min(1, boss.hit/0.7); ctx.fillStyle = "rgba(154,246,246,0.55)"; ctx.beginPath(); ctx.arc(boss.x, boss.y, r+26, 0, 7); ctx.fill(); }
      ctx.restore();
    }

    // 근처 조각만 표시(글로우 OFF·3단 발견)
    if (nearShard && IMG.shard) {
      const c = shardCenter(nearShard);
      glow(() => ctx.drawImage(IMG.shard, c.x - IMG.shard.width/2, c.y - IMG.shard.height/2), "#34e2e2", 8);
      tag("조사 [E]", c.x, c.y - 14);
    }

    // 소음 고리 — 이동 시 소리가 퍼진다(Echo가 듣는 범위). 멈추면 사라짐.
    if (playerNoise > 0 && echoes.length) {
      const pr = playerNoise * (0.75 + 0.25 * Math.sin(performance.now() / 200));
      ctx.save(); ctx.globalAlpha = 0.16; ctx.strokeStyle = "#9af6f6"; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(player.x, player.y, pr, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }

    // y정렬: murk/echo/player
    const ents = [...murks.map(m => ({ y: m.y, m })), ...echoes.map(m => ({ y: m.y, ee: m })), { y: player.y, p: true }];
    ents.sort((a, b) => a.y - b.y);
    for (const e of ents) {
      if (e.p) {
        const sp = spriteFor();
        if (sp && sp.width) {
          const sneak = !!keys["shift"];                          // 은신: 흐려지고 글로우 약화(피드백)
          ctx.save(); if (sneak) ctx.globalAlpha = 0.6;
          if (player.facing === "side" && player.flip) { ctx.translate(player.x, 0); ctx.scale(-1, 1); ctx.translate(-player.x, 0); }
          glow(() => ctx.drawImage(sp, Math.round(player.x - sp.width/2), Math.round(player.y - sp.height + 6)), sneak ? "#2a3d2a" : "#8ef548", sneak ? 1 : 3);
          ctx.restore();
        }
      } else if (e.ee) {
        const m = e.ee;                                         // Echo(청각): 시야콘 없음. 추격 시 붉은 고리.
        if (m.chasing) { ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = "#ff7a7a"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(m.x, m.y, 15, 0, 7); ctx.stroke(); ctx.restore(); }
        const esp = (m.chasing && IMG.echo_chase) ? IMG.echo_chase : IMG.echo;   // 추격 시 파문 적색 스프라이트
        if (esp) glow(() => ctx.drawImage(esp, Math.round(m.x - esp.width/2), Math.round(m.y - esp.height/2)), m.chasing ? "#ff7a6a" : "#9af6f6", m.chasing ? 4 : 2);
        cbMark(m);
      } else {
        const m = e.m;
        // 시야콘 (감지 범위 — 평시 보라/추격 빨강/물러남 약하게). 은신 중이면 흐려져 '덜 보임'을 전달.
        const hf = (m.fov * Math.PI / 180) / 2, sneaking = (keys["shift"] || touch.sneak);
        const cAlpha = (m.warded > 0 ? 0.03 : (m.chasing ? 0.18 : 0.08)) * (sneaking ? 0.45 : 1);
        ctx.save(); ctx.globalAlpha = cAlpha; ctx.fillStyle = m.chasing ? "#ff5a5a" : "#7a5cff";
        ctx.beginPath(); ctx.moveTo(m.x, m.y);
        ctx.arc(m.x, m.y, m.sightPx * (sneaking ? 0.5 : 1), m.faceAngle - hf, m.faceAngle + hf); ctx.closePath(); ctx.fill(); ctx.restore();
        const msp = (m.chasing && IMG.murk_chase) ? IMG.murk_chase : IMG.murk;     // 추격 시 눈 적색 스프라이트
        if (msp) glow(() => ctx.drawImage(msp, Math.round(m.x - msp.width/2), Math.round(m.y - msp.height/2)), m.chasing ? "#ff5a5a" : "#7a5cff", m.chasing ? 4 : 2);
        cbMark(m);
      }
    }

    // (직감 H의 메시지는 HUD 단계에서 캔버스 px로 그린다 — drawGuide)

    // 조각 수집 링 — core 시안 / echo 흰빛 / false 차가운 황색(채도 빠짐)
    if (collectFx) {
      const f = collectFx.t / 0.55, t = 1 - f, rr = 6 + 22 * t;
      const col = collectFx.type === "core" ? "154,246,246" : collectFx.type === "false" ? "202,161,90" : "230,240,240";
      ctx.save(); ctx.globalAlpha = 0.7 * f; ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(collectFx.x, collectFx.y - 2, rr, 0, 7); ctx.stroke();
      if (collectFx.type !== "false") { ctx.globalAlpha = 0.25 * f; ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(collectFx.x, collectFx.y - 2, rr*0.6, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    // 피격 플래시
    if (flash > 0 && !reduceFlash) { ctx.fillStyle = `rgba(255,90,90,${Math.min(0.5, flash)})`; ctx.fillRect(0, 0, NW, NH); }

    ctx.restore();
    if (phase === "play" || phase === "recall") drawAmbient();
    drawHUD();
    if (phase === "play") { drawGuide(); if (stageCardT > 0) overlayStageCard(); if (paused) overlayPause(); }
    if (phase === "title") overlayTitle();
    if (phase === "select") overlaySelect();
    if (phase === "recall" && recall) overlayRecall();
    if (phase === "setback") overlayCenter("…어둡다. 여기는…", "#9ab", "방금 떠올린 기억이 다시 어둠에 잠겼다 · 같은 자리에서 되찾을 수 있다");
    if (phase === "cleared") overlayCenter("챕터 1 클리어 · 「지로의 방」", "#8ef548", "지로가 첫 기억들을 되찾았다.");
    if (phase === "intro") overlayIntro();
    if (phase === "realize") overlayRealize();
    if (phase === "branch") overlayBranch();
    if (phase === "choice") overlayChoice();
    if (phase === "ending") overlayEnding();
    if (phase === "transition") overlayTransition();
    if (phase === "journal" && window.Journal) { try {
      const meta = { idx: chapterIdx, clearedMax, hope, stages: CHAPTERS.map((k, i) => ({
        title: DATA[k].title, epiphany: DATA[k].epiphany || [], cleared: i <= clearedMax, current: i === chapterIdx })) };
      Journal.draw(ctx, cv, st, D, IMG, meta);
    } catch (e) { console.error(e); } }
    if (veil > 0) { ctx.save(); ctx.fillStyle = "rgba(3,5,9," + Math.min(1, veil / 0.8) + ")"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); }
    drawTouch();
  }

  // 화면 터치 조작(가상 조이스틱 + 스킬 버튼) + 토글
  function drawTouch() {
    if (!ready) return;
    const tr = touchToggleRect();
    ctx.save(); ctx.fillStyle = "rgba(10,16,20,.78)"; rrect(tr.x, tr.y, tr.w, tr.h, 8); ctx.fill();
    ctx.fillStyle = touchUI ? "#8ef548" : "#8aa7a9"; ctx.font = "12px 'Noto Sans KR',sans-serif"; ctx.textAlign = "center";
    ctx.fillText(touchUI ? "터치 조작: 켜짐" : "터치 조작: 꺼짐", tr.x + tr.w / 2, tr.y + 17); ctx.restore();
    if (!touchUI || phase !== "play") return;
    // 가상 조이스틱(좌하단; 터치 중엔 누른 위치)
    const jcx = touch.joyId !== null ? touch.joyCx : 124, jcy = touch.joyId !== null ? touch.joyCy : cv.height - 120;
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = "#34e2e2"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jcx, jcy, 56, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(52,226,226,.22)"; ctx.beginPath(); ctx.arc(jcx + touch.jx * 44, jcy + touch.jy * 44, 24, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.7; ctx.fillStyle = "#6b8a8c"; ctx.font = "11px 'Noto Sans KR',sans-serif"; ctx.textAlign = "center";
    ctx.fillText("드래그하여 이동", jcx, jcy + 78); ctx.restore();
    // 스킬 버튼(우하단)
    for (const b of touchButtons()) {
      const usesLight = (b.id === "q");          // 비추기만 빛 소모. 직감(H)은 무료.
      const noLight = usesLight && st.light < 1;
      const on = (b.id === "shift" && touch.sneak) || (b.id === "q" && auraFx > 0);
      ctx.save(); ctx.globalAlpha = noLight ? 0.5 : 1;
      ctx.fillStyle = on ? "rgba(52,226,226,.35)" : "rgba(10,16,20,.82)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.strokeStyle = on ? "#9af6f6" : "#34e2e2"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
      ctx.fillStyle = "#eafaff"; ctx.font = "bold 13px 'Noto Sans KR',sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(b.label, b.x, b.y); ctx.textBaseline = "alphabetic";

  // 원화를 화면 가득(cover) 그린다 + 상·하단 스크림(텍스트 가독)
  function drawIllCover(img, alpha) {
    ctx.fillStyle = "#04070b"; ctx.fillRect(0, 0, cv.width, cv.height);
    if (img && img.width) {
      const r = Math.max(cv.width / img.width, cv.height / img.height), w = img.width*r, h = img.height*r;
      ctx.save(); ctx.globalAlpha = alpha; const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, (cv.width - w)/2, (cv.height - h)/2, w, h); ctx.imageSmoothingEnabled = sm; ctx.restore();
    }
  }
  function scrim(yTop, yBot, a0, a1) {
    ctx.save(); const g = ctx.createLinearGradient(0, yTop, 0, yBot);
    g.addColorStop(0, "rgba(3,5,9," + a0 + ")"); g.addColorStop(1, "rgba(3,5,9," + a1 + ")");
    ctx.fillStyle = g; ctx.fillRect(0, yTop, cv.width, yBot - yTop); ctx.restore();
  }

  function glow(fn, color, blur) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore(); }
  // 페어 물건 아이콘(월드 좌표, 작게) — 기억과 함께 이동하는 '스토리텔링 오브젝트'
  function drawObj(kind, x, y) {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.lineWidth = 1;
    if (kind === "frame") { ctx.fillStyle = "#6b5536"; ctx.fillRect(-4, -5, 8, 9); ctx.fillStyle = "#9fc5c5"; ctx.fillRect(-3, -4, 6, 6); ctx.fillStyle = "#caa15a"; ctx.fillRect(-2, -3, 2, 2); }
    else if (kind === "bottle") { ctx.fillStyle = "#cfe6e6"; ctx.fillRect(-2, -5, 4, 8); ctx.fillStyle = "#8aa7a9"; ctx.fillRect(-2, -6, 4, 2); ctx.fillStyle = "#9af6f6"; ctx.fillRect(-1, 0, 2, 3); }
    else if (kind === "bowl") { ctx.fillStyle = "#7a6a52"; ctx.beginPath(); ctx.ellipse(0, 1, 5, 3, 0, 0, 7); ctx.fill(); ctx.fillStyle = "#3a4a4e"; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, 7); ctx.fill(); }
    else if (kind === "treat") { ctx.fillStyle = "#caa15a"; ctx.beginPath(); ctx.ellipse(-1, 0, 4, 2.4, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(6, -2); ctx.lineTo(6, 2); ctx.closePath(); ctx.fill(); }
    else if (kind === "chart") { ctx.fillStyle = "#e6eef0"; ctx.fillRect(-4, -5, 8, 10); ctx.strokeStyle = "#7a9aa0"; ctx.beginPath(); for (let i = -3; i <= 3; i += 2) { ctx.moveTo(-3, i); ctx.lineTo(3, i); } ctx.stroke(); }
    else if (kind === "card") { ctx.fillStyle = "#caa15a"; rrect(-5, -3, 10, 6, 2); ctx.fill(); ctx.fillStyle = "#6b5536"; ctx.fillRect(-3, 0, 6, 1.5); }
    else if (kind === "bell") { ctx.fillStyle = "#caa15a"; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.fillStyle = "#6b5536"; ctx.beginPath(); ctx.arc(0, 1, 1.4, 0, 7); ctx.fill(); ctx.fillStyle = "#8aa7a9"; ctx.fillRect(-1, -6, 2, 2); }
    ctx.restore();
  }
  function cbMark(m) {            // 색약 보조: 추격 중인 적에 색과 무관한 표식(흰 점선 고리 + !)

  // ── HUD (스케일 1:1, 픽셀 위 오버레이) ─────────────────────
  function drawHUD() {

    const sLabel = "STAGE " + (chapterIdx + 1) + ".  " + (D.title || "");
    ctx.font = "bold 13px 'Noto Sans KR',sans-serif"; const slw = ctx.measureText(sLabel).width + 28;
    ctx.fillStyle = "rgba(8,14,18,.7)"; rrect((W - slw)/2, 8, slw, 22, 7); ctx.fill();

  // 중앙 정렬 줄바꿈(세로 중앙) — 회상/엔딩 본문용. 호출 전 textAlign='center' 가정.
  function wrapCenter(t, cx, y, maxw, lh) {
    const words = (t||"").split(/\s+/); const lines = []; let line = "";
    for (const w of words) { const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxw && line) { lines.push(line); line = w; } else line = test; }
    if (line) lines.push(line);
    let yy = y - (lines.length - 1) * lh / 2;
    for (const l of lines) { ctx.fillText(l, cx, yy); yy += lh; }
  }

  // ── 루프 ──────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) { let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
    try { update(dt); } catch (e) { console.error(e); }
    draw(); requestAnimationFrame(frame); }
  // 디버그 스냅샷(테스트용, 무해): 상태 읽기 전용
  if (typeof window !== 'undefined') {
    window.__ziro = () => ({ phase, px: player.x, py: player.y, mem: st ? st.mem : 0, ch: chapterIdx,
                             camX, camY, nw: NW, nh: NH, realizeI, realizeLen: realizeLines.length, choiceSel, endingType, paused, reduceFlash });
    window.__loadStage = (i) => { loadStage(i); phase = "play"; };
    window.__debugClear = () => { for (const s of shards) if (s.type === "core") Core.collect(st, s); if (boss) boss.dispelled = true; beginRealize(); };  // 테스트용
    window.__hope = (v) => { if (typeof v === "number") hope = v; return hope; };
    window.__collectCores = () => { for (const s of shards) if (s.type === "core") Core.collect(st, s); };  // 보스 테스트용(해소 안 함)
    window.__layoutCheck = () => { const occ = (c,r) => D.collision.some(q => c>=q[0]&&c<q[0]+q[2]&&r>=q[1]&&r<q[1]+q[3]); let bad = 0;
      for (const s of shards) if (occ(s.tile[0], s.tile[1])) bad++;
      for (const m of murks.concat(echoes)) for (const p of m.patrol) if (occ(Math.round((p.x-TILE/2)/TILE), Math.round((p.y-TILE/2)/TILE))) bad++;
      const reach = new Set(reachableTiles(D).map(t => t[0]+","+t[1]));   // 스폰 도달 가능 집합
      let unreachable = 0; for (const s of shards) if (!reach.has(s.tile[0]+","+s.tile[1])) unreachable++;
      return { bad, unreachable, shards: shards.length, idx: chapterIdx }; };
    window.__boss = () => boss ? { hp: boss.hp, dispelled: boss.dispelled, phase: boss.phase } : null;
    window.__setRandom = (v) => { RANDOMIZE = !!v; };   // 테스트 결정성용(랜덤 끄기)
    window.__title = () => gotoTitle();
    window.__sel = () => ({ phase, selIdx, clearedMax });
  }
  loadProgress();               // 저장된 클리어 진행 로드(스테이지 선택 해금)
  loadStage(0);                 // 첫 챕터 초기화(맵·엔티티·상태)
  requestAnimationFrame(frame);
})();

</script>
