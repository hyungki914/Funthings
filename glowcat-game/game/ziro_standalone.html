  // ((a + π) mod 2π) - π  (음수 mod 보정 포함)
  let r = (a + Math.PI) % TWO_PI;
  if (r < 0) r += TWO_PI;
  return r - Math.PI;
}

// ---- 상태 생성 (§2-1 / §2-2 스키마 입력) ----
function newState(data) {
  data = data || {};
  return {
    mem: C.START_MEM,
    light: C.START_LIGHT,
    iframe: 0,
    coresNeeded: data.coresNeeded,
    collected: new Set(),   // 수집한 조각 id
    coreOrder: [],          // 코어 획득 순서 (후퇴 봉인용)
    sealed: new Set(),      // 임시 봉인된 코어 id
    identity: 0,            // 0..5 정체성 해금 단계
    _coreSlots: {},         // (내부) 코어 id -> identitySlot, 정체성 재계산용
  };
}

// ---- 조각 수집 ----
function collect(state, shard) {
  if (state.collected.has(shard.id)) {
    return { ok: false };
  }
  let gainMem = 0;
  let gainLight = 0;
  const type = shard.type;

  if (type === 'core') {
    gainMem = C.CORE_GAIN;
    gainLight = 1;
    state.identity = Math.max(state.identity, shard.identitySlot + 1);
    state.coreOrder.push(shard.id);
    if (state._coreSlots) state._coreSlots[shard.id] = shard.identitySlot;
  } else if (type === 'echo') {
    gainMem = C.ECHO_GAIN;
    gainLight = 1;
  } else if (type === 'false') {
    gainMem = C.FALSE_HIT;
    gainLight = 0;
  }

  state.mem = clamp(state.mem + gainMem, 0, C.MEM_MAX);
  state.light = clamp(state.light + gainLight, 0, C.LIGHT_MAX);
  state.collected.add(shard.id);

  return {
    ok: true,
    type,
    recallText: shard.recall,
    gainMem,
    gainLight,
    identitySlot: shard.identitySlot,
  };
}

// ---- 적 접촉 ----
function contact(state) {
  if (state.iframe > 0) return false; // 무적 프레임 중 = 무피해
  state.mem = clamp(state.mem + C.CONTACT, 0, C.MEM_MAX);
  state.iframe = C.IFRAME_S;
  return true;
}

// ---- 시간 진행: 회복/감소/iframe 감소 ----
function tick(state, dt, ctx) {
  ctx = ctx || {};
  state.iframe = Math.max(0, state.iframe - dt);
  if (ctx.inSafe) {
    state.mem = Math.min(C.MEM_MAX, state.mem + C.REST_PER_S * dt);
  } else if (ctx.inDanger) {
    state.mem = Math.max(0, state.mem - C.DECAY_PER_S * dt);
  }
}

// ---- 힌트(직감) 사용: 빛 자원 소모 ----
function useHint(state) {
  if (state.light >= C.HINT_COST) {
    state.light -= C.HINT_COST;
    return { ok: true };
  }
  return { ok: false };
}

// ---- 후퇴(Setback): mem<=0 → 최근 코어 1개 임시봉인 + 안전지대 복귀 신호 ----
function setbackIfDead(state) {
  if (state.mem > 0) return false;

  // 가장 최근 획득한 코어를 봉인
  const lastCoreId = state.coreOrder.pop();
  if (lastCoreId !== undefined) {
    state.sealed.add(lastCoreId);
    state.collected.delete(lastCoreId);
  }

  // 남은 코어 기준으로 정체성 재계산
  state.identity = recomputeIdentity(state);

  state.mem = C.SETBACK_MEM;
  return true;
}

// 봉인 처리 후 남은 코어 슬롯으로 정체성 재계산 (없으면 0)
function recomputeIdentity(state) {
  let maxSlot = -1;
  const coreSlots = state._coreSlots || {};
  for (const id of state.coreOrder) {
    const slot = coreSlots[id];
    if (typeof slot === 'number' && slot > maxSlot) maxSlot = slot;
  }
  return maxSlot < 0 ? 0 : maxSlot + 1;
}

// ---- Murk 시야 감지 (거리 + 각도. LoS는 호출측 보강) ----
function murkSees(murk, px, py) {
  const dx = px - murk.x;
  const dy = py - murk.y;
  const dist = Math.hypot(dx, dy);
  if (dist > murk.sight) return false;
  if (dist === 0) return true; // 동일 위치는 항상 감지
  const toPlayer = Math.atan2(dy, dx);
  const diff = Math.abs(normAngle(toPlayer - murk.faceAngle));
  const halfFov = (murk.fov * Math.PI / 180) / 2;
  return diff <= halfFov;
}

// ---- 정체성 상태 ----
function identityState(state) {
  const portraits = ['q', 'silhouette', 'eyes', 'face', 'name'];
  const unlocked = state.identity;
  const portrait = portraits[Math.min(unlocked, 4)];
  return { unlocked, portrait, label: portrait };
}

// ---- 챕터 클리어: 보유 코어 수 >= 필요 수 (봉인된 건 제외) ----
function chapterClear(state) {
  return state.coreOrder.length >= state.coresNeeded;
}

// 투사 콘 판정(순수): (ox,oy)에서 faceAngle 방향 len·halfDeg 콘 안에 (px,py)가 드는가
function inCone(ox, oy, faceAngle, len, halfDeg, px, py) {
  const dx = px - ox, dy = py - oy;
  const dist = Math.hypot(dx, dy);
  if (dist > len) return false;
  if (dist < 0.0001) return true;
  const a = normAngle(Math.atan2(dy, dx) - faceAngle);
  return Math.abs(a) <= halfDeg * Math.PI / 180;
}

const Core = {
  C,
  clamp,
  normAngle,
  inCone,
  newState,
  collect,
  contact,
  tick,
  useHint,
  setbackIfDead,
  murkSees,
  identityState,
  chapterClear,
};

if (typeof window !== 'undefined') window.Core = Core;
if (typeof module !== 'undefined') module.exports = Core;

</script>

const AMBIENT_VOL = 0.05;  // 앰비언트 패드(아주 작게)

// ---- 모듈 내부 상태 (싱글톤) ----
// 모든 라이브 노드/타이머 핸들을 여기 모아 정리 누수를 방지한다.
const S = {
  ctx: null,          // AudioContext
  master: null,       // 마스터 GainNode
  muted: false,
  ambientNodes: null, // { oscs:[], gain, filter, lfo? }
  droneNodes: null,   // { osc, sub, noise, gain, filter }
  droneLevel: 0,
  heart: { timer: null, bpm: 0 }, // setTimeout 핸들 + 현재 bpm
  // ---- BGM 음악 엔진 상태 ----
  // 동시에 두 보이스(이전/새 테마)를 가질 수 있어 크로스페이드 시 둘 다 추적한다.
  music: {
    theme: null,        // 현재 활성 테마 이름
    voices: [],         // [{ theme, def, bus(GainNode), timer, scheduled:[], step, nextTime, fading }]
  },
};

// ---------------------------------------------------------------------------
// 내부 헬퍼 — 전부 폴백 안전(throw 금지)
// ---------------------------------------------------------------------------

// AudioContext 생성자 조회 (브라우저에서만 존재). 없으면 null.
function getCtor() {
  if (typeof window === 'undefined') return null;
  return window.AudioContext || window.webkitAudioContext || null;
}

// 컨텍스트가 살아있고 사용 가능한지.
function ready() {
  return !!(S.ctx && S.master && S.ctx.state !== 'closed');
}

// 현재 시각(초). 컨텍스트 없으면 0.
function now() {
  return S.ctx ? S.ctx.currentTime : 0;
}

// 음소거 반영한 마스터 목표 게인.
function masterTarget() {
  return S.muted ? 0 : MASTER_VOL;
}

// 화이트노이즈 1초 버퍼 생성(짧은 SFX/드론 거칠기용). 실패 시 null.
function makeNoiseBuffer() {
  if (!S.ctx) return null;
  try {
    const len = Math.floor(S.ctx.sampleRate); // 1초
    const buf = S.ctx.createBuffer(1, len, S.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  } catch (e) {
    return null;
  }
}

// 게인 노드를 t0~t1에 걸쳐 부드럽게 변경(클릭 방지). 안전 가드 포함.
function ramp(param, value, t0, dur) {
  try {
    param.cancelScheduledValues(t0);
    param.setValueAtTime(param.value, t0);
    param.linearRampToValueAtTime(value, t0 + dur);
  } catch (e) { /* no-op */ }
}

// 노드 배열/단일 노드를 안전하게 정지·해제.
function stopNode(node, at) {
  if (!node) return;
  try {
    if (typeof node.stop === 'function') node.stop(at);
  } catch (e) { /* 이미 정지됨 등 */ }
  try {
    node.disconnect();
  } catch (e) { /* no-op */ }
}

// 여러 노드를 한 번에 정지.
function stopAll(nodes, at) {
  if (!nodes) return;
  for (let i = 0; i < nodes.length; i++) stopNode(nodes[i], at);
}

// ---------------------------------------------------------------------------
// 공개 API
// ---------------------------------------------------------------------------

// AudioContext 생성(있으면 재사용). 사용자 제스처 핸들러에서 호출 → resume().
function init() {
  try {
    if (!S.ctx) {
      const Ctor = getCtor();
      if (!Ctor) return; // 미지원 → 무음 폴백
      S.ctx = new Ctor();
      S.master = S.ctx.createGain();
      S.master.gain.value = masterTarget();
      S.master.connect(S.ctx.destination);
    }
    // 자동재생 정책: 제스처 컨텍스트에서 resume.
    if (S.ctx.state === 'suspended' && typeof S.ctx.resume === 'function') {
      S.ctx.resume().catch(function () { /* 무시 */ });
    }
  } catch (e) {
    // 생성 실패 → 전체 무음 폴백
    S.ctx = null;
    S.master = null;
  }
}

// 마스터 게인 0/기본 토글.
function setMuted(flag) {
  S.muted = !!flag;
  if (!ready()) return;
  ramp(S.master.gain, masterTarget(), now(), 0.05);
}

function toggleMute() {
  setMuted(!S.muted);
  return S.muted;
}

// 잔잔한 패드: 저음 사인/삼각 디튠 2~3개 + 로우패스. 루프 대신 지속 오실레이터.
function ambient(on) {
  if (!ready()) return;

  // 항상 이전 것 먼저 정지(중복 생성 방지).
  if (S.ambientNodes) {
    const a = S.ambientNodes;
    const t = now();
    ramp(a.gain.gain, 0, t, 0.6);            // 부드럽게 페이드아웃
    stopAll(a.oscs, t + 0.7);
    stopNode(a.lfo, t + 0.7);
    stopNode(a.filter, t + 0.7);
    stopNode(a.gain, t + 0.7);
    S.ambientNodes = null;
  }
  if (!on) return;

  try {
    const t = now();
    const gain = S.ctx.createGain();
    gain.gain.value = 0;
    const filter = S.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 520;            // 따뜻하고 어두운 패드
    filter.Q.value = 0.6;

    // 저음역 디튠 보이싱(루트/5도/옥타브 살짝 어긋나게).
    const voices = [
      { f: 110.0, type: 'sine',     det: -4 }, // A2
      { f: 164.8, type: 'triangle', det: +5 }, // E3 (5도)
      { f: 220.0, type: 'sine',     det: -2 }, // A3 (옥타브)
    ];
    const oscs = [];
    for (let i = 0; i < voices.length; i++) {
      const v = voices[i];
      const o = S.ctx.createOscillator();
      o.type = v.type;
      o.frequency.value = v.f;
      try { o.detune.value = v.det; } catch (e) { /* 일부 환경 */ }
      o.connect(filter);
      o.start(t);
      oscs.push(o);
    }

    // 아주 느린 LFO로 필터 컷오프를 미세하게 흔들어 '숨쉬는' 느낌(서스펜스).
    let lfo = null;
    try {
      lfo = S.ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.07;            // ~14초 주기
      const lfoGain = S.ctx.createGain();
      lfoGain.gain.value = 90;               // ±90Hz 흔들림
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start(t);
      // lfoGain은 lfo와 운명을 같이하므로 별도 추적 불필요(disconnect는 filter 해제 시 정리됨).
    } catch (e) {
      lfo = null;
    }

    filter.connect(gain);
    gain.connect(S.master);
    ramp(gain.gain, AMBIENT_VOL, t, 2.0);    // 천천히 페이드인

    S.ambientNodes = { oscs: oscs, gain: gain, filter: filter, lfo: lfo };
  } catch (e) {
    S.ambientNodes = null;
  }
}

// 기억 조각 획득: 맑은 종소리(사인 아르페지오 + 짧은 감쇠 엔벨로프).
function chime() {
  if (!ready()) return;
  try {
    const t = now();
    // A장조 계열 맑은 3음 아르페지오 (A5, C#6, E6).
    const notes = [880.0, 1108.7, 1318.5];
    const step = 0.10;     // 음 간격
    for (let i = 0; i < notes.length; i++) {
      const start = t + i * step;
      const o = S.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = notes[i];
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.16, start + 0.01); // 빠른 어택
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.9); // 종처럼 길게 감쇠
      o.connect(g);
      g.connect(S.master);
      o.start(start);
      o.stop(start + 1.0); // 끝나면 자동 해제(누수 방지)
    }
  } catch (e) { /* 무음 폴백 */ }
}

// 적 근접/위험: level(0~1) 비례 저음 드론 볼륨/거칠기. 0이면 페이드아웃.
function drone(level) {
  if (!ready()) return;
  let lv = (typeof level === 'number' && isFinite(level)) ? level : 0;
  if (lv < 0) lv = 0;
  if (lv > 1) lv = 1;
  S.droneLevel = lv;

  try {
    const t = now();

    // level<=0 → 페이드아웃 후 정지.
    if (lv <= 0.0001) {
      if (S.droneNodes) {
        const d = S.droneNodes;
        ramp(d.gain.gain, 0, t, 0.8);
        stopNode(d.osc, t + 1.0);
        stopNode(d.sub, t + 1.0);
        stopNode(d.noise, t + 1.0);
        stopNode(d.filter, t + 1.0);
        stopNode(d.gain, t + 1.0);
        S.droneNodes = null;
      }
      return;
    }

    // 아직 없으면 한 번만 생성(중복 생성 방지). 이후엔 파라미터만 갱신.
    if (!S.droneNodes) {
      const gain = S.ctx.createGain();
      gain.gain.value = 0;

      const filter = S.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 240;
      filter.Q.value = 1.0;

      const osc = S.ctx.createOscillator();
      osc.type = 'sawtooth';        // 거친 배음
      osc.frequency.value = 55;     // A1
      const sub = S.ctx.createOscillator();
      sub.type = 'sine';            // 묵직한 서브
      sub.frequency.value = 27.5;   // A0
      osc.connect(filter);
      sub.connect(filter);

      // 노이즈 한 줌으로 '거칠기' 부여(level로 양 조절).
      let noise = null;
      const noiseGain = S.ctx.createGain();
      noiseGain.gain.value = 0;
      const buf = makeNoiseBuffer();
      if (buf) {
        noise = S.ctx.createBufferSource();
        noise.buffer = buf;
        noise.loop = true;
        const nf = S.ctx.createBiquadFilter();
        nf.type = 'lowpass';
        nf.frequency.value = 400;
        noise.connect(nf);
        nf.connect(noiseGain);
        noiseGain.connect(gain);
        noise.start(t);
      }

      filter.connect(gain);
      gain.connect(S.master);
      osc.start(t);
      sub.start(t);

      S.droneNodes = {
        osc: osc, sub: sub, noise: noise,
        filter: filter, gain: gain, noiseGain: noiseGain,
      };
    }

    // level에 비례해 볼륨/거칠기/밝기 갱신(부드럽게).
    const d = S.droneNodes;
    ramp(d.gain.gain, 0.04 + 0.16 * lv, t, 0.4);     // 볼륨
    if (d.noiseGain) ramp(d.noiseGain.gain, 0.06 * lv, t, 0.4); // 거칠기
    ramp(d.filter.frequency, 180 + 260 * lv, t, 0.4); // 밝기(긴장↑)
  } catch (e) {
    S.droneNodes = null;
  }
}

// 한 번의 'lub-dub' 펄스 2타를 즉시 스케줄(저음 사인 + 빠른 감쇠).
function heartbeatPulse() {
  if (!ready()) return;
  try {
    const t = now();
    // lub(강) → dub(약), 약 0.16초 간격.
    const beats = [
      { at: 0.0,  freq: 55, peak: 0.22 },
      { at: 0.16, freq: 48, peak: 0.15 },
    ];
    for (let i = 0; i < beats.length; i++) {
      const b = beats[i];
      const start = t + b.at;
      const o = S.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(b.freq * 1.6, start);
      o.frequency.exponentialRampToValueAtTime(b.freq, start + 0.06); // 살짝 떨어지는 '쿵'
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(b.peak, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
      o.connect(g);
      g.connect(S.master);
      o.start(start);
      o.stop(start + 0.3); // 자동 해제
    }
  } catch (e) { /* 무음 폴백 */ }
}

// 저(低)기억 심장박동: bpm으로 'lub-dub'를 반복 스케줄. bpm=0이면 정지.
function heartbeat(bpm) {
  // 항상 이전 타이머 정리(중복/누수 방지).
  if (S.heart.timer !== null) {
    clearTimeout(S.heart.timer);
    S.heart.timer = null;
  }
  const rate = (typeof bpm === 'number' && isFinite(bpm)) ? bpm : 0;
  S.heart.bpm = rate;

  if (rate <= 0) return;      // 정지
  if (!ready()) return;       // 컨텍스트 없으면 무음(상태만 보관)

  const periodMs = Math.max(250, 60000 / rate); // 과도한 빈도 방지(상한 240bpm)

  const loop = function () {
    // 정지/뮤트 후 잔여 콜백 안전 처리.
    if (S.heart.bpm <= 0) { S.heart.timer = null; return; }
    heartbeatPulse();
    // bpm이 도중에 바뀌면 다음 주기에 반영.
    const p = Math.max(250, 60000 / S.heart.bpm);
    S.heart.timer = setTimeout(loop, p);
  };

  heartbeatPulse();                          // 즉시 첫 박동
  S.heart.timer = setTimeout(loop, periodMs);
}

// 단발 효과음. name: 'contact' | 'setback' | 'step'.
function sfx(name) {
  if (!ready()) return;
  try {
    const t = now();

    if (name === 'contact') {
      // 피격: 짧은 노이즈 버스트 + 다운피치 톤.
      const buf = makeNoiseBuffer();
      if (buf) {
        const n = S.ctx.createBufferSource();
        n.buffer = buf;
        const nf = S.ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.setValueAtTime(900, t);
        nf.frequency.exponentialRampToValueAtTime(200, t + 0.18); // 다운피치
        const ng = S.ctx.createGain();
        ng.gain.setValueAtTime(0.25, t);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        n.connect(nf); nf.connect(ng); ng.connect(S.master);
        n.start(t);
        n.stop(t + 0.22);
      }
      // 살짝 깔리는 톤으로 충격감 보강.
      const o = S.ctx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.22);

    } else if (name === 'setback') {
      // 후퇴: 저음 역(reverse)스윕 느낌 — 낮은 데서 차오르다 뚝.
      const o = S.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(40, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.7); // 상승 스윕
      const filter = S.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(160, t);
      filter.frequency.exponentialRampToValueAtTime(900, t + 0.7);
      const g = S.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.6);  // 차오름(reverse swell)
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.78); // 급정지
      o.connect(filter); filter.connect(g); g.connect(S.master);
      o.start(t); o.stop(t + 0.85);

    } else if (name === 'step') {
      // 발소리: 아주 약한 클릭(짧은 노이즈 핑).
      const buf = makeNoiseBuffer();
      if (buf) {
        const n = S.ctx.createBufferSource();
        n.buffer = buf;
        const nf = S.ctx.createBiquadFilter();
        nf.type = 'lowpass';
        nf.frequency.value = 1200;
        const ng = S.ctx.createGain();
        ng.gain.setValueAtTime(0.05, t);  // 아주 약하게
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        n.connect(nf); nf.connect(ng); ng.connect(S.master);
        n.start(t);
        n.stop(t + 0.06);
      }
    }
    // 알 수 없는 name → 무음(throw 금지).
  } catch (e) { /* 무음 폴백 */ }
}

// ---------------------------------------------------------------------------
// BGM 음악 엔진 — 멜로디가 흐르는 스테이지별 루프 BGM
//
// 설계:
//  - 룩어헤드 스케줄러: setInterval(LOOKAHEAD_MS)로 깨어나 SCHEDULE_AHEAD초
//    앞 구간의 노트를 ctx.currentTime 기준 절대 시각으로 예약 → 타이밍 드리프트 방지.
//  - 각 테마는 스케일/진행/음색/템포를 배열·상수로 정의해 갈아끼우는 구조.
//  - 노트는 ADSR 비슷한 짧은 게인 엔벨로프 + 끝나면 osc.stop()으로 자동 해제(누수 방지).
//  - 테마 전환은 크로스페이드(이전 voice 페이드아웃→정리, 새 voice 페이드인).
//  - 정지·전환 시 interval과 예약된 노드를 반드시 정리.
//  - 음역/볼륨은 ambient/drone과 겹쳐도 뭉개지지 않게 분리(멜로디 중고음, 패드 저음·소volume).
// ---------------------------------------------------------------------------

const MUSIC_MELODY_VOL = 0.075; // 멜로디 노트 피크(0.06~0.09 범위)
const MUSIC_PAD_VOL = 0.035;    // 패드(멜로디보다 작게)
const MUSIC_BASS_VOL = 0.05;    // 저음 드론/펄스
const LOOKAHEAD_MS = 120;       // 스케줄러 깨어나는 주기
const SCHEDULE_AHEAD = 0.9;     // 미리 예약할 구간(초)
const MUSIC_FADE = 1.6;         // 크로스페이드 시간(초)

// 평균율 주파수 헬퍼: A4=440 기준 반음(semitone) 오프셋 → Hz.
function midiHz(semisFromA4) {
  return 440 * Math.pow(2, semisFromA4 / 12);
}

// 테마 정의. 각 테마는 한 '스텝'(시간 격자)마다 어떤 노트를 칠지 패턴 배열로 기술한다.
// patterns의 각 원소: { t: 스텝오프셋, note: 반음(A4=0), dur: 길이초, vol: 0~1, voice: 'mel'|'pad'|'bass', type: 파형 }
// stepDur(초)와 steps(루프 총 스텝수)로 루프 길이를 결정.
//
// 음정 표기(A4=0 기준 반음): A2=-24 A3=-12 C4=-9 D4=-7 E4=-5 F4=-4 G4=-2 A4=0
//   B4=2 C5=3 D5=5 E5=7 F5=8 G5=10 A5=12 ...  (단음계/도리안 위주)
const MUSIC_THEMES = {
  // intro: 매우 희소·저음·거의 앰비언트. 드문 단음 + 낮은 드론. 불안/적막.
  intro: {
    stepDur: 0.95,
    steps: 16,
    melType: 'sine',
    padType: 'sine',
    bassType: 'sine',
    melVol: 0.85,
    padVol: 0.7,
    // A 단조 분위기, 거의 정적. 낮은 드론 패드가 길게 깔리고 멜로디는 드물게.
    patterns: [
      // 길게 깔리는 저음 드론(루트 A2, 5도 E3) — 루프마다 갱신.

// 한 노트를 ctx 절대시각 startAbs에 스케줄. voice 종류별 음색/엔벨로프/필터를 분리.
// 생성한 노드는 자동 stop되며, voice.scheduled에 등록해 강제 정리(전환/정지)에도 대비.
function scheduleNote(voice, p, startAbs) {
  if (!ready()) return;
  try {
    const def = voice.def;
    const hz = midiHz(p.note);
    const dur = p.dur;
    const o = S.ctx.createOscillator();
    o.type = p.type || (p.voice === 'pad' ? def.padType : p.voice === 'bass' ? def.bassType : def.melType);
    o.frequency.value = hz;

    const g = S.ctx.createGain();

    // voice별 음역 분리용 로우/하이 필터 + 볼륨 스케일.
    let peak;
    let attack, release;
    let outNode = g;
    if (p.voice === 'pad') {
      peak = MUSIC_PAD_VOL * (p.vol != null ? p.vol : 1) * (def.padVol || 1);
      attack = Math.min(0.8, dur * 0.35);
      release = Math.min(2.5, dur * 0.6);
      const lp = S.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 700;     // 패드는 어둡게(멜로디와 음색 분리)
      lp.Q.value = 0.5;
      o.connect(lp);
      lp.connect(g);
    } else if (p.voice === 'bass') {
      peak = MUSIC_BASS_VOL * (p.vol != null ? p.vol : 1);
      attack = Math.min(0.05, dur * 0.2);
      release = Math.min(0.5, dur * 0.5);
      const lp = S.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 220;     // 저음만
      o.connect(lp);
      lp.connect(g);
    } else { // 'mel'
      peak = MUSIC_MELODY_VOL * (p.vol != null ? p.vol : 1) * (def.melVol || 1);
      attack = 0.02;
      release = Math.min(0.9, dur * 0.7);
      const hp = S.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 180;     // 멜로디는 저음과 분리(중고음역)
      o.connect(hp);
      hp.connect(g);
    }
    if (peak <= 0) peak = 0.0001;

    // ADSR 비슷한 엔벨로프(클릭 방지 위해 0.0001부터).
    const t0 = startAbs;
    const tEnd = startAbs + dur;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    g.gain.setValueAtTime(peak, Math.max(t0 + attack, tEnd - release));
    g.gain.exponentialRampToValueAtTime(0.0001, tEnd);

    g.connect(voice.bus);
    o.start(t0);
    o.stop(tEnd + 0.05); // 끝나면 자동 해제(누수 방지)

    // 강제 정리 대비 추적(완료된 노드는 onended에서 제거).
    const entry = { o: o, g: g };
    voice.scheduled.push(entry);
    o.onended = function () {
      try { o.disconnect(); } catch (e) { /* no-op */ }
      try { g.disconnect(); } catch (e) { /* no-op */ }
      const idx = voice.scheduled.indexOf(entry);
      if (idx >= 0) voice.scheduled.splice(idx, 1);
    };
  } catch (e) { /* 무음 폴백 */ }
}

// 한 voice의 룩어헤드 틱: nextTime 이전(SCHEDULE_AHEAD 이내)에 들어오는 모든 노트를 예약.
function musicTick(voice) {
  if (!ready()) { return; }
  const def = voice.def;
  const loopDur = def.steps * def.stepDur;
  const horizon = now() + SCHEDULE_AHEAD;

  // nextTime: 다음에 예약할 절대 시각. step: 현재 루프 내 스텝 위치(정수 진행).
  while (voice.nextTime < horizon) {
    const loopStart = voice.nextTime - (voice.step * def.stepDur);
    // 이번 스텝에 시작하는 모든 패턴 노트 예약.
    for (let i = 0; i < def.patterns.length; i++) {
      const p = def.patterns[i];
      if (p.t === voice.step) {
        scheduleNote(voice, p, voice.nextTime);
      }
    }
    voice.step += 1;
    voice.nextTime += def.stepDur;
    if (voice.step >= def.steps) {
      voice.step = 0; // 루프 반복(nextTime은 그대로 이어져 드리프트 없음)
      // loopStart 사용 안 함(연속 진행). 변수는 가독성 참고용.
      void loopStart;
    }
  }
}

// voice 하나를 완전히 정리(interval + 예약 노드 + 버스).
function teardownVoice(voice, fadeOut) {
  if (!voice) return;
  if (voice.timer !== null) {
    clearInterval(voice.timer);
    voice.timer = null;
  }
  const t = now();
  try {
    if (voice.bus) {
      if (fadeOut) {
        ramp(voice.bus.gain, 0, t, MUSIC_FADE);
      } else {
        ramp(voice.bus.gain, 0, t, 0.05);
      }
    }
  } catch (e) { /* no-op */ }
  const killAt = t + (fadeOut ? MUSIC_FADE : 0.05);
  // 예약된 노드 강제 정리(페이드 후).
  const sched = voice.scheduled.slice();
  for (let i = 0; i < sched.length; i++) {
    stopNode(sched[i].o, killAt + 0.05);
    stopNode(sched[i].g, killAt + 0.05);
  }
  voice.scheduled.length = 0;
  // 버스도 페이드 끝나면 끊기.
  const bus = voice.bus;
  if (bus) {
    setTimeout(function () {
      try { bus.disconnect(); } catch (e) { /* no-op */ }
    }, (fadeOut ? MUSIC_FADE : 0.05) * 1000 + 120);
  }
}

// 새 테마 voice를 생성·시작(페이드인 + 스케줄러 가동).
function startVoice(theme) {
  const def = MUSIC_THEMES[theme];
  if (!def || !ready()) return null;
  try {
    const bus = S.ctx.createGain();
    bus.gain.value = 0.0001;
    bus.connect(S.master);
    const t = now();
    ramp(bus.gain, 1, t, MUSIC_FADE); // 버스 자체는 1까지(노트 볼륨은 노트별로 작게)

    const voice = {
      theme: theme,
      def: def,
      bus: bus,
      timer: null,
      scheduled: [],
      step: 0,
      nextTime: now() + 0.12, // 살짝 앞에서 시작
    };

    musicTick(voice); // 즉시 첫 구간 예약
    voice.timer = setInterval(function () {
      // 컨텍스트가 죽으면 안전 정지.
      if (!ready()) { teardownVoice(voice, false); return; }
      musicTick(voice);
    }, LOOKAHEAD_MS);

    return voice;
  } catch (e) {
    return null;
  }
}

// 공개 API: 스테이지별 루프 멜로디 BGM. theme 전환 시 크로스페이드, null/'stop'이면 정지.
function music(theme) {
  // 정규화.
  if (theme === 'stop') theme = null;

  // 컨텍스트 없으면 상태만 보관하고 무음 폴백(throw 금지).
  if (!ready()) {
    S.music.theme = theme;
    return;
  }

  // 같은 테마 재요청 → 무시(중복 생성 방지).
  if (theme === S.music.theme && S.music.voices.length > 0) return;

  // 정지 또는 전환: 기존 voice 전부 페이드아웃 정리.
  const old = S.music.voices.slice();
  S.music.voices.length = 0;
  for (let i = 0; i < old.length; i++) {
    teardownVoice(old[i], true);
  }

  S.music.theme = theme;
  if (!theme) return; // 정지면 여기서 끝.

  // 알 수 없는 테마 → 무음(throw 금지).
  if (!MUSIC_THEMES[theme]) return;

  const voice = startVoice(theme);
  if (voice) S.music.voices.push(voice);
}

const Audio2 = {
  init: init,
  setMuted: setMuted,
  toggleMute: toggleMute,
  ambient: ambient,
  chime: chime,
  drone: drone,
  heartbeat: heartbeat,
  heartbeatPulse: heartbeatPulse,
  sfx: sfx,
  music: music,
};

if (typeof window !== 'undefined') window.Audio2 = Audio2;

    panel:    "#0a1014",
    panelDk:  "#080c0f",   // 잠긴 칸(더 어두운 패널)
    panelHi:  "#10262a",   // 해금 칸 배경(시안 톤)
    line:     "#1d3236",
    lineDk:   "#243036",   // 잠긴 칸 테두리
    cyan:     "#34e2e2",   // 중립
    cyanDk:   "#2a6e72",   // 해금 칸 테두리(시안 톤 다운)
    lime:     "#8ef548",   // 해금/긍정
    danger:   "#ff5a5a",
    text:     "#eafaff",
    textSub:  "#8aa7a9",
    lock:     "#5a7375",   // 잠금 텍스트
    lockIcon: "#3a5557",   // 자물쇠 형태
    falseGold:"#caa15a",   // false 단서
    falseTxt: "#e8c884",   // false 텍스트(밝게)
    falsePnl: "#1a1408",   // false 패널
    falseLn:  "#3a2a14",   // false 테두리
    echo:     "#8aa7a9",   // echo 타입(보조 회색)
    portBg:   "#0e0f13",   // 초상 셀 배경
    portDk:   "#0a0d0f",   // 잠긴 초상 셀 배경
  };
  var FONT = "'Noto Sans KR',sans-serif";

  // ---- 그리기 헬퍼 ------------------------------------------------------------
  function rrect(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    if (r < 0) r = 0;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 한 줄 말줄임(…) — maxw(px) 초과 시 잘라 '…' 부착. ctx.font 은 호출 전에 설정.
  function ellipsize(ctx, text, maxw) {
    text = (text == null ? "" : String(text));
    if (ctx.measureText(text).width <= maxw) return text;
    var ell = "…";
    var ellW = ctx.measureText(ell).width;
    if (maxw <= ellW) return ell;
    var lo = 0, hi = text.length, best = "";
    // 이진 탐색으로 들어가는 최대 글자 수 찾기
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var cand = text.slice(0, mid);
      if (ctx.measureText(cand).width + ellW <= maxw) { best = cand; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best.replace(/\s+$/, "") + ell;
  }

  // 자물쇠 아이콘(걸쇠 + 몸통). cx,cy = 자물쇠 몸통 중앙 근처, s = 크기 배수.
  function lockIcon(ctx, cx, cy, s, color) {
    s = s || 1;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3 * s;
    // 걸쇠(U자)
    var shW = 10 * s;     // 걸쇠 폭
    var shTop = cy - 9 * s;
    ctx.beginPath();
    ctx.moveTo(cx - shW / 2, cy - 1 * s);
    ctx.lineTo(cx - shW / 2, shTop + shW / 2);
    ctx.arc(cx, shTop + shW / 2, shW / 2, Math.PI, 0);
    ctx.lineTo(cx + shW / 2, cy - 1 * s);
    ctx.stroke();
    // 몸통
    var bw = 18 * s, bh = 14 * s;
    rrect(ctx, cx - bw / 2, cy - 1 * s, bw, bh, 3 * s);
    ctx.fill();
    ctx.restore();
  }

  // 체크(✓) 마크
  function checkMark(ctx, x, y, size, color) {
    ctx.save();
    ctx.font = "bold " + size + "px " + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("✓", x, y);
    ctx.restore();
  }

  // ---- 초상 진화 셀(원형) -----------------------------------------------------
  // stage: 0=? 1=실루엣 2=눈 3=얼굴 4=이름.  active: 또렷 여부.
  // nameReveal: 이름(stage 4)을 공개할지(정체성===5일 때만 true). 이름은 최종 보상.
  function portraitCell(ctx, cx, cy, r, stage, active, IMG, nameReveal) {
    ctx.save();

    // 배경 원
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? COL.portBg : COL.portDk;
    ctx.fill();

    // 테두리: 활성도에 따라 시안 → 라인
    ctx.lineWidth = 2;
    ctx.strokeStyle = active ? (stage >= 3 ? COL.cyan : "#2a4a4e") : COL.line;
    if (stage === 4) { ctx.setLineDash([4, 5]); }   // 이름 단계는 점선(미완)
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 비활성 셀은 클립 안에서 흐리게 그림
    var fg = active ? 1 : 0.28;

    // 셀 내부를 원으로 클립(그림이 원 밖으로 새지 않게)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
    ctx.clip();

    var silCol = active ? "#1a2228" : "#12181c";
    var eyeCol = active ? COL.lime : "#3a4a30";

    if (stage === 0) {
      // ? 물음표
      ctx.globalAlpha = fg;
      ctx.fillStyle = active ? COL.cyan : COL.lock;
      ctx.font = "bold " + Math.round(r * 0.95) + "px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", cx, cy + 1);
    } else if (stage === 1) {
      // 실루엣: 귀 두 개 + 머리 타원
      ctx.globalAlpha = fg;
      ctx.fillStyle = silCol;
      // 귀
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.62, cy - r * 0.10);
      ctx.lineTo(cx - r * 0.34, cy - r * 0.82);
      ctx.lineTo(cx - r * 0.08, cy - r * 0.16);
      ctx.closePath();
      ctx.moveTo(cx + r * 0.62, cy - r * 0.10);
      ctx.lineTo(cx + r * 0.34, cy - r * 0.82);
      ctx.lineTo(cx + r * 0.08, cy - r * 0.16);
      ctx.closePath();
      ctx.fill();
      // 머리
      ctx.beginPath();
      ctx.ellipse(cx, cy + r * 0.12, r * 0.72, r * 0.64, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 2) {
      // 눈 두 개(빛남)
      ctx.globalAlpha = fg;
      ctx.fillStyle = eyeCol;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.32, cy, r * 0.26, r * 0.33, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + r * 0.32, cy, r * 0.26, r * 0.33, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 3) {
      // 얼굴: 가능하면 IMG.ziro_d0 사용, 없으면 절차적 얼굴
      var im = IMG && IMG.ziro_d0;
      if (im && im.width) {
        ctx.globalAlpha = fg;
        var prevSmooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;   // 픽셀아트 또렷하게
        // 원 안에 맞춰 비율 유지 스케일
        var box = r * 1.7;
        var scale = Math.min(box / im.width, box / im.height);
        var dw = im.width * scale, dh = im.height * scale;
        ctx.drawImage(im, Math.round(cx - dw / 2), Math.round(cy - dh / 2), Math.round(dw), Math.round(dh));
        ctx.imageSmoothingEnabled = prevSmooth;
      } else {
        // 절차적 얼굴(귀 + 눈 + 입)
        ctx.globalAlpha = fg;
        ctx.fillStyle = "#0d0d10";
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.72, cy - r * 0.18);
        ctx.lineTo(cx - r * 0.38, cy - r * 0.92);
        ctx.lineTo(cx - r * 0.08, cy - r * 0.22);
        ctx.closePath();
        ctx.moveTo(cx + r * 0.72, cy - r * 0.18);
        ctx.lineTo(cx + r * 0.38, cy - r * 0.92);
        ctx.lineTo(cx + r * 0.08, cy - r * 0.22);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = active ? COL.cyan : "#2a4a4e";
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.62, cy - r * 0.30);
        ctx.lineTo(cx - r * 0.40, cy - r * 0.78);
        ctx.lineTo(cx - r * 0.20, cy - r * 0.30);
        ctx.closePath();
        ctx.moveTo(cx + r * 0.62, cy - r * 0.30);
        ctx.lineTo(cx + r * 0.40, cy - r * 0.78);
        ctx.lineTo(cx + r * 0.20, cy - r * 0.30);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = eyeCol;
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.34, cy + r * 0.04, r * 0.30, r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + r * 0.34, cy + r * 0.04, r * 0.30, r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = active ? COL.cyan : "#2a4a4e";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.17, cy + r * 0.5);
        ctx.quadraticCurveTo(cx, cy + r * 0.66, cx + r * 0.17, cy + r * 0.5);
        ctx.stroke();
      }
    } else if (stage === 4) {
      // 이름 단계: 이름은 최종 보상 → 정체성===5(nameReveal)일 때만 'ZIRO' 공개.
      // 그 전(active여도)에는 '?'로 가린다.
      ctx.globalAlpha = fg;
      ctx.fillStyle = nameReveal ? COL.lime : (active ? COL.cyan : COL.lock);
      ctx.font = "bold " + Math.round(nameReveal ? r * 0.5 : r * 0.95) + "px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(nameReveal ? "ZIRO" : "?", cx, cy);
    }

    ctx.restore(); // 클립 해제
    ctx.restore();
  }

  // ---- 메인 그리기 ------------------------------------------------------------
  function draw(ctx, cv, st, DATA, IMG) {
    if (!ctx || !cv) return;

    // --- 인자 정규화(읽기 전용 복사 없이 안전 참조) -------------------------
    st = st || {};
    var W = cv.width, H = cv.height;

    // DATA 가 루트인지 챕터 형태인지 유연 처리
    var chap = (DATA && DATA.chapter1) ? DATA.chapter1 : (DATA || {});
    var shards = (chap && chap.shards) || [];
    var labels = (chap && chap.identityLabels) || [];

    var identity   = (typeof st.identity === "number") ? st.identity : 0;
    var coresNeed  = (typeof st.coresNeeded === "number") ? st.coresNeeded : (chap.coresNeeded || 0);
    // coreOrder 길이(획득 코어 수). 없으면 collected 내 core 개수로 폴백.
    var coreCount;
    if (st.coreOrder && typeof st.coreOrder.length === "number") {
      coreCount = st.coreOrder.length;
    } else {
      coreCount = 0;
      for (var ci = 0; ci < shards.length; ci++) {
        if (shards[ci].type === "core" && collectedHas(st, shards[ci].id)) coreCount++;
      }
    }

    // collected 멤버십(Set 우선, 배열 폴백)
    function collectedHas(state, id) {
      var c = state.collected;
      if (!c) return false;
      if (typeof c.has === "function") return c.has(id);
      if (typeof c.indexOf === "function") return c.indexOf(id) >= 0;
      return false;
    }

    ctx.save();
    ctx.textBaseline = "alphabetic";

    // === 0. 전체 dim 배경 =====================================================
    ctx.fillStyle = COL.dim;
    ctx.fillRect(0, 0, W, H);

    // 바깥 여백 / 레이아웃 기준
    var PAD = Math.round(W * 0.038);          // 좌우 바깥 여백
    if (PAD < 28) PAD = 28;
    var contentX = PAD;
    var contentW = W - PAD * 2;

    // === 1. 제목 ==============================================================
    var titleY = Math.round(H * 0.082);
    ctx.textAlign = "left";
    ctx.fillStyle = COL.text;
    ctx.font = "800 32px " + FONT;
    ctx.fillText("기억 일지 · 정체성", contentX, titleY);
    ctx.fillStyle = COL.cyan;
    ctx.font = "14px " + FONT;
    ctx.fillText("MEMORY JOURNAL · IDENTITY", contentX + 2, titleY + 22);
    // 우상단 진행 표기(정체성 n/5)
    ctx.textAlign = "right";
    ctx.fillStyle = COL.lime;
    ctx.font = "700 20px " + FONT;
    ctx.fillText(identity + " / 5 복원", W - PAD, titleY);

    // === 2. 초상 진화 행 ======================================================
    // 5개 원형 셀(? → 실루엣 → 눈 → 얼굴 → 이름). identity 단계까지 또렷.
    var rowY = titleY + 58;
    ctx.textAlign = "left";
    ctx.fillStyle = COL.textSub;
    ctx.font = "14px " + FONT;
    ctx.fillText("기억이 차오를수록 또렷해진다", contentX, rowY);

    var cellR = 34;
    var cyCell = rowY + 18 + cellR;
    var nCells = 5;
    // 셀 사이 간격을 contentW 안에 균등 분배
    var span = contentW - cellR * 2;
    var gap = (nCells > 1) ? span / (nCells - 1) : 0;
    var firstCx = contentX + cellR;

    for (var s = 0; s < nCells; s++) {
      var cx = Math.round(firstCx + gap * s);
      // 현재 identity 단계까지 또렷. identity=0 이면 첫 셀(?)만 약하게 활성.
      // 매핑: 셀 s 는 "정체성이 s단계 이상이면 또렷".
      //   identity=0 → 아무 단계도 완성 안 됨이지만, ?(stage0)는 항상 보이는 시작점.
      var active = (s === 0) ? true : (identity >= s);
      // identity 가 그 단계'에 도달'했을 때만 또렷: s번째 셀은 identity>=s.
      // 이름 셀(s===4)은 정체성===5 일 때만 공개(nameReveal).
      var nameReveal = (s === 4) && (identity >= 5);
      portraitCell(ctx, cx, cyCell, cellR, s, active, IMG, nameReveal);

      // 셀 사이 화살표(›)
      if (s < nCells - 1) {
        var ax = Math.round(cx + gap / 2);
        ctx.fillStyle = "#2a4a4e";
        ctx.font = "22px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText("›", ax, cyCell + 7);
        ctx.textAlign = "left";
      }
    }
    // 단계 캡션
    var capNames = ["?", "실루엣", "눈", "얼굴", "이름"];
    ctx.fillStyle = COL.lock;
    ctx.font = "12px " + FONT;
    ctx.textAlign = "center";
    for (var cap = 0; cap < nCells; cap++) {
      var capx = Math.round(firstCx + gap * cap);
      ctx.fillStyle = ((cap === 0) || identity >= cap) ? COL.textSub : COL.lock;
      ctx.fillText(capNames[cap], capx, cyCell + cellR + 18);
    }

    // === 2열 패널 영역(좌: 정체성 / 우: 기억 목록) ============================
    var colsTop = cyCell + cellR + 34;
    var bottomReserve = 96;                    // 하단 미스터리 바 + 푸터 공간
    var colsH = H - colsTop - bottomReserve;
    if (colsH < 120) colsH = 120;
    var colGap = Math.round(W * 0.024);
    if (colGap < 18) colGap = 18;
    var leftW = Math.round((contentW - colGap) * 0.5);
    var rightW = contentW - colGap - leftW;
    var leftX = contentX;
    var rightX = contentX + leftW + colGap;

    // --- 좌 패널 배경 ---
    ctx.fillStyle = COL.panel;
    rrect(ctx, leftX, colsTop, leftW, colsH, 14); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
    rrect(ctx, leftX, colsTop, leftW, colsH, 14); ctx.stroke();
    // --- 우 패널 배경 ---
    ctx.fillStyle = COL.panel;
    rrect(ctx, rightX, colsTop, rightW, colsH, 14); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
    rrect(ctx, rightX, colsTop, rightW, colsH, 14); ctx.stroke();

    // === 3. 정체성 5슬롯 (좌 패널) ===========================================
    var lInX = leftX + 20;
    var lInW = leftW - 40;
    ctx.textAlign = "left";
    ctx.fillStyle = COL.lime;
    ctx.font = "700 17px " + FONT;
    ctx.fillText("정체성 카드", lInX, colsTop + 30);

    var slotTop = colsTop + 48;
    var slotN = 5;
    var slotGap = 12;
    var slotH = Math.floor((colsH - 48 - 20 - slotGap * (slotN - 1)) / slotN);
    if (slotH > 70) slotH = 70;
    if (slotH < 44) slotH = 44;

    // 정체성 슬롯의 "해금" 규칙: i < identity 이면 해금(연두 ✓), 아니면 잠금.
    // 이름 슬롯(index 3)은 identity<5 이면 'ZIRO'를 '?????'로 가림.
    var NAME_SLOT = 3;
    for (var i = 0; i < slotN; i++) {
      var sy = slotTop + i * (slotH + slotGap);
      var unlocked = (i < identity);
      var label = labels[i] != null ? String(labels[i]) : ("슬롯 " + (i + 1));

      // 패널
      if (unlocked) {
        ctx.fillStyle = COL.panelHi;
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.fill();
        ctx.strokeStyle = COL.cyanDk; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.stroke();
      } else {
        ctx.fillStyle = COL.panelDk;
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.fill();
        ctx.strokeStyle = COL.lineDk; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
        rrect(ctx, lInX, sy, lInW, slotH, 12); ctx.stroke();
        ctx.setLineDash([]);
      }

      // 좌측 아이콘 원
      var icR = Math.min(20, slotH / 2 - 6);
      var icCx = lInX + 16 + icR;
      var icCy = sy + slotH / 2;
      ctx.beginPath();
      ctx.arc(icCx, icCy, icR, 0, Math.PI * 2);
      ctx.fillStyle = unlocked ? "#10262a" : "#11181d";
      ctx.fill();
      if (unlocked) {
        // 해금: 슬롯 번호(또는 점) 표시
        ctx.fillStyle = COL.cyan;
        ctx.font = "700 16px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(i + 1), icCx, icCy + 1);
        ctx.textBaseline = "alphabetic";
      } else {
        // 잠금: 자물쇠
        lockIcon(ctx, icCx, icCy - 4, Math.min(1, icR / 18), COL.lockIcon);
      }

      // 텍스트 영역
      var txX = icCx + icR + 14;
      var txMaxW = lInX + lInW - txX - 30;     // 우측 상태 마크 공간 확보

      // 라벨(상단 보조) / 값(하단 강조)을 라벨 문자열에서 분리 시도.
      // identityLabels 예: "종: 고양이" / "이름: ? (지로)" / "왜 잊었나"
      var caption, value;
      var colonIdx = label.indexOf(":");
      if (colonIdx >= 0) {
        caption = label.slice(0, colonIdx).trim();
        value = label.slice(colonIdx + 1).trim();
      } else {
        caption = "";
        value = label;
      }

      // 이름 슬롯 마스킹: identity<5 이면 값은 '?????'(ZIRO 가림)
      var isName = (i === NAME_SLOT);
      if (isName) {
        if (caption === "") caption = "이름";
        if (identity >= 5) value = "ZIRO";       // 최종 보상 공개
        else value = "?????";                    // 가림
      }

      // 마지막 슬롯(진실)은 잠금 시 캡션을 '??? · 잠김' 으로
      var twoLine = (slotH >= 50);

      if (unlocked) {
        if (twoLine && caption) {
          ctx.fillStyle = COL.textSub;
          ctx.font = "13px " + FONT;
          ctx.textAlign = "left";
          ctx.fillText(ellipsize(ctx, caption, txMaxW), txX, sy + slotH / 2 - 6);
          ctx.fillStyle = COL.text;
          ctx.font = "700 19px " + FONT;
          ctx.fillText(ellipsize(ctx, value, txMaxW), txX, sy + slotH / 2 + 18);
        } else {
          ctx.fillStyle = COL.text;
          ctx.font = "700 18px " + FONT;
          ctx.textAlign = "left";
          ctx.fillText(ellipsize(ctx, (caption ? caption + " · " : "") + value, txMaxW), txX, sy + slotH / 2 + 6);
        }
        // 해금 ✓ (연두)
        checkMark(ctx, lInX + lInW - 14, sy + slotH / 2 + 8, 22, COL.lime);
      } else {
        // 잠금: 회색
        var lockCap = caption ? caption : "???";
        if (twoLine) {

          ctx.font = "700 19px " + FONT;

          ctx.fillStyle = COL.lock;
          ctx.font = "700 17px " + FONT;
          ctx.textAlign = "left";
          ctx.fillText(ellipsize(ctx, value + " · 잠김", txMaxW), txX, sy + slotH / 2 + 6);

    // === 4. 수집한 기억 목록 (우 패널) =======================================

    ctx.textAlign = "left";
    ctx.fillStyle = COL.lime;
    ctx.font = "700 17px " + FONT;
    ctx.fillText("수집한 기억", rInX, colsTop + 30);

    ctx.fillStyle = COL.echo;     ctx.fillText("● 에코", rightX + rightW - 90,  colsTop + 30);
    ctx.fillStyle = COL.falseGold;ctx.fillText("● 거짓", rightX + rightW - 28,  colsTop + 30);
    ctx.textAlign = "left";

    var listBottom = colsTop + colsH - 16;

        ctx.strokeStyle = (type === "false") ? COL.falseLn : COL.cyanDk;
        ctx.lineWidth = 1.5; ctx.setLineDash([]);
        rrect(ctx, cardX, iy, cardW, itemH, 10); ctx.stroke();
      } else {
        ctx.fillStyle = COL.panelDk;

        ctx.strokeStyle = COL.lineDk;

        rrect(ctx, cardX, iy, cardW, itemH, 10); ctx.stroke();
        ctx.setLineDash([]);
      }

      var txX2 = cardX + 14;
      var txMaxW2 = cardX + cardW - txX2 - 14;
      var twoLine2 = (itemH >= 46);

      if (got) {
        // 제목(타입 라벨) + 회상 앞부분

          ctx.font = "700 14px " + FONT;
          ctx.fillText(ellipsize(ctx, typeLabel, txMaxW2), txX2, iy + itemH / 2 - 5);
          ctx.fillStyle = (type === "false") ? "#8a7a4a" : COL.textSub;
          ctx.font = "13px " + FONT;
          ctx.fillText(ellipsize(ctx, recallTxt, txMaxW2), txX2, iy + itemH / 2 + 16);
        } else {
          ctx.fillStyle = (type === "false") ? COL.falseTxt : tColor;
          ctx.font = "700 14px " + FONT;
          ctx.fillText(ellipsize(ctx, typeLabel + " — " + recallTxt, txMaxW2), txX2, iy + itemH / 2 + 5);
        }
      } else {
        // 미수집: 코어는 '??? (빠진 기억)' 빈칸, 그 외 미수집도 동일 처리
        var blankMain = isCoreMissing ? "???  (빠진 기억)" : "???";
        var blankSub = isCoreMissing ? "아직 되찾지 못한 코어 기억" : "미발견";
        if (twoLine2) {
          ctx.fillStyle = COL.lock;
          ctx.font = "700 14px " + FONT;
          ctx.fillText(ellipsize(ctx, blankMain, txMaxW2), txX2, iy + itemH / 2 - 5);
          ctx.fillStyle = COL.lock;
          ctx.font = "13px " + FONT;
          ctx.fillText(ellipsize(ctx, blankSub, txMaxW2), txX2, iy + itemH / 2 + 16);
        } else {
          ctx.fillStyle = COL.lock;
          ctx.font = "700 14px " + FONT;
          ctx.fillText(ellipsize(ctx, blankMain, txMaxW2), txX2, iy + itemH / 2 + 5);
        }
      }
    }

    // === 5. 하단 중심 미스터리 바 + 진행 =====================================
    var barH = 52;
    var barY = H - bottomReserve + 8;
    var barW = contentW;
    var barX = contentX;
    ctx.fillStyle = COL.panelDk;
    rrect(ctx, barX, barY, barW, barH, 12); ctx.fill();
    ctx.strokeStyle = COL.lineDk; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    rrect(ctx, barX, barY, barW, barH, 12); ctx.stroke();

    // 자물쇠(거짓 골드 톤 — 진실은 잠겨 있다)
    lockIcon(ctx, barX + 30, barY + barH / 2 - 4, 1, COL.falseGold);

    ctx.textAlign = "left";
    ctx.fillStyle = COL.falseTxt;
    ctx.font = "700 15px " + FONT;
    ctx.fillText("중심 미스터리 · 왜 나는 잊었는가", barX + 56, barY + 22);
    ctx.fillStyle = COL.textSub;
    ctx.font = "12px " + FONT;
    ctx.fillText("코어 기억을 모아 진실의 문을 연다", barX + 56, barY + 41);

    // 진행 바: coreOrder.length / coresNeeded
    var pbW = 180;
    var pbX = barX + barW - pbW - 24;
    var pbY = barY + barH / 2 - 5;
    var frac = (coresNeed > 0) ? Math.max(0, Math.min(1, coreCount / coresNeed)) : 0;
    ctx.fillStyle = "#16262a";
    rrect(ctx, pbX, pbY, pbW, 10, 5); ctx.fill();
    if (frac > 0) {
      ctx.fillStyle = (frac >= 1) ? COL.lime : COL.cyan;
      rrect(ctx, pbX, pbY, Math.max(10, pbW * frac), 10, 5); ctx.fill();
    }
    // 진행 수치
    ctx.textAlign = "right";
    ctx.fillStyle = (frac >= 1) ? COL.lime : COL.text;
    ctx.font = "700 14px " + FONT;
    ctx.fillText(coreCount + " / " + coresNeed, pbX + pbW, pbY - 8);

    // === 6. 푸터 =============================================================
    ctx.textAlign = "center";
    ctx.fillStyle = COL.lock;
    ctx.font = "14px " + FONT;
    ctx.fillText("[Tab] 닫기", W / 2, H - 16);

    ctx.restore();
  }

  return { draw: draw };
})();

<script>
/* ===== main.js ===== */
/* main.js — 통합부(렌더·입력·루프·HUD). 전역 ASSETS / Core / DATA / Audio2 사용. */
(function () {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  try { cv.setAttribute("tabindex", "0"); cv.style.outline = "none"; cv.focus(); } catch (e) {}  // 키 포커스 확보

  const C = Core.C;
  // 존재하는 챕터만 순서대로 — data.js에 chapter2/3 추가 시 자동 체이닝
  const CHAPTERS = ["chapter1", "chapter2", "chapter3"].filter(k => DATA[k]);
  let chapterIdx = 0;
  let D, TILE, NW, NH, S, st, colls, safes, door, murks;   // loadStage()에서 채움
  const px = (t) => t * TILE + TILE / 2;

  // ── 에셋 로드 ──────────────────────────────────────────────
  const IMG = {}; let toLoad = 0, loaded = 0, ready = false;
  for (const k in ASSETS) {
    toLoad++; const im = new Image();
    im.onload = () => { if (++loaded >= toLoad) ready = true; };
    im.onerror = () => { if (++loaded >= toLoad) ready = true; };
    im.src = ASSETS[k]; IMG[k] = im;
  }

  // ── 상태 ──────────────────────────────────────────────────
  let phase = "title";   // title | intro | play | recall | setback | journal | transition
  const player = { x: 0, y: 0, vx: 0, vy: 0, dir: Math.PI/2,
                   facing: "down", flip: false, animT: 0, frame: 0, step: 0, w: 10, h: 8 };
  let recall = null, hintTimer = 0, hintTarget = null, setbackT = 0, flash = 0, muted = false, shake = 0;
  let trail = [], trailCD = 0, projecting = false; const illuminated = new Set();
  const AURA_R = 46;              // 기억 비추기 aura 반경(전방위)
  let lowLightTip = 0;           // '빛 부족' 안내 쿨다운
  // 온보딩/피드백 상태
  let elapsed = 0, lTutDone = false, corePulse = 0; let toasts = [];   // toasts: {text,color,t}
  let sawMurk = false;
  // 인트로(콜드 오픈) / 스테이지 전환
  let introT = 0, transT = 0, veil = 0, hasNext = false;
  const INTRO = [
    { at: 0.0, line: "…어둡다." },
    { at: 2.2, line: "여기는… 어디지." },
    { at: 4.6, line: "나는… 나는 누… ?" },
    { at: 6.6, line: "무언가 빠져나가고 있어 — 흩어지기 전에, 붙잡아야 해." },
  ];
  const INTRO_END = 9.0;
  function startIntro() {
    phase = "intro"; introT = 0; firstGesture();
    if (window.Audio2) try { if (Audio2.music) Audio2.music("intro"); if (Audio2.heartbeatPulse) Audio2.heartbeatPulse(); } catch (e) {}  // 콜드오픈: 심장박동 1회
  }
  function skipIntro() { if (introT < 0.5) return; endIntro(); }
  function endIntro() {                       // 검정→방 페이드인(veil) + 스킵키 누수 방지(clearEdges)
    phase = "play"; veil = 0.8; clearEdges();
    if (window.Audio2 && Audio2.music) try { Audio2.music(D.music || "room"); } catch (e) {}
  }
  function beginTransition() {
    phase = "transition"; transT = 0; hasNext = (chapterIdx + 1) < CHAPTERS.length;
    if (window.Audio2) try { if (Audio2.music) Audio2.music(null); Audio2.drone(0); Audio2.heartbeat(0); if (Audio2.chime) Audio2.chime(); } catch (e) {}  // 위험 오디오 정지 + 클리어 스팅어
  }
  // 챕터 매니저 — 맵/엔티티를 idx 챕터로 (재)초기화 (data에 chapter2/3 추가 시 체이닝)
  function loadStage(idx) {
    chapterIdx = idx; D = DATA[CHAPTERS[idx]];
    TILE = D.tile; NW = D.cols * TILE; NH = D.rows * TILE; S = Math.max(1, Math.floor(cv.width / NW));
    st = Core.newState(D);
    colls = D.collision.map(([c, r, w, h]) => ({ x: c*TILE, y: r*TILE, w: w*TILE, h: h*TILE }));
    safes = (D.safeZones || []).map(([c, r, w, h]) => ({ x: c*TILE, y: r*TILE, w: w*TILE, h: h*TILE }));
    door = D.door ? { x: px(D.door.tile[0]), y: px(D.door.tile[1]) } : null;
    murks = (D.murks || []).map(m => ({ id:m.id, wp:0, x:px(m.patrol[0][0]), y:px(m.patrol[0][1]),
      patrol:m.patrol.map(p => ({ x:px(p[0]), y:px(p[1]) })), speed:m.speed||38, sightPx:(m.sightTiles||3.3)*TILE,
      fov:(m.fovDeg||90), faceAngle:0, chasing:false, lost:0 }));
    player.x = px(D.spawn[0]); player.y = px(D.spawn[1]); player.vx = player.vy = 0;
    player.facing = "down"; player.flip = false; player.frame = 0; player.step = 0; player.dir = Math.PI/2;
    trail = []; illuminated.clear(); nearShard = null; hintTimer = 0; toasts = [];
    elapsed = 0; lTutDone = false; sawMurk = false; corePulse = 0; flash = 0; shake = 0;
  }
  function gotoTitle() { loadStage(0); phase = "title"; if (window.Audio2 && Audio2.music) try { Audio2.music(null); } catch (e) {} }

  // ── 입력 ──────────────────────────────────────────────────
  const keys = {}; const edge = {};
  // 물리 키 코드 매핑 — 한글 IME/레이아웃과 무관하게 동작(WASD가 ㅈㅁㄴㅇ로 들어와도 OK).
  const CODEMAP = {
    KeyW:"w", KeyA:"a", KeyS:"s", KeyD:"d", KeyE:"e", KeyL:"l", KeyQ:"q", KeyH:"h", KeyM:"m",
    ArrowUp:"arrowup", ArrowDown:"arrowdown", ArrowLeft:"arrowleft", ArrowRight:"arrowright",
    Space:" ", Enter:"enter", NumpadEnter:"enter", Tab:"tab", Escape:"escape",
    ShiftLeft:"shift", ShiftRight:"shift"
  };
  const GAMEKEYS = ["w","a","s","d","e","l","q","h","m","tab","shift"," ","arrowup","arrowdown","arrowleft","arrowright"];
  function setKey(e, v) {
    const k = CODEMAP[e.code] || (e.key || "").toLowerCase();   // e.code 우선 → IME 영향 없음
    if (v && !keys[k]) edge[k] = true;
    keys[k] = v;
    if (v) { if (phase === "title") startIntro(); else if (phase === "intro") skipIntro(); }
    if (GAMEKEYS.includes(k) && e.preventDefault) e.preventDefault();  // 브라우저 단축키 가로채기 방지
  }
  addEventListener("keydown", e => setKey(e, true));
  addEventListener("keyup", e => setKey(e, false));
  function onClick() { try { cv.focus(); } catch (e) {} firstGesture();
    if (phase === "title") startIntro(); else if (phase === "intro") skipIntro(); else if (phase === "recall") closeRecall(); }
  cv.addEventListener("mousedown", onClick);
  function firstGesture() { try { if (window.Audio2) Audio2.init(); } catch (e) {} }  // BGM은 music()이 담당
  addEventListener("keydown", firstGesture, { once: true });
  function clearEdges() { for (const k in edge) edge[k] = false; }

  // ── 헬퍼 ──────────────────────────────────────────────────
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  function aabb(x, y, w, h, r) { return x - w/2 < r.x + r.w && x + w/2 > r.x && y - h/2 < r.y + r.h && y + h/2 > r.y; }
  function inAny(x, y, w, h, list) { for (const r of list) if (aabb(x, y, w, h, r)) return r; return null; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function shardCenter(s) { return { x: px(s.tile[0]), y: px(s.tile[1]) }; }
  function isDone(s) { return st.collected.has ? st.collected.has(s.id) : (st.collected.indexOf?.(s.id) >= 0); }

  // ── 업데이트 ──────────────────────────────────────────────
  function update(dt) {
    if (phase === "title" || phase === "cleared") return;
    if (phase === "intro") { introT += dt; if (introT >= INTRO_END) endIntro(); clearEdges(); return; }
    if (phase === "transition") {
      transT += dt;
      if (hasNext && transT > 2.6) {                          // 다음 챕터 자동 로드(체이닝)
        loadStage(chapterIdx + 1); phase = "play"; veil = 0.8;
        if (window.Audio2 && Audio2.music) try { Audio2.music(D.music || "room"); } catch (e) {}
      } else if (!hasNext && transT > 1.2 && (edge[" "] || edge["enter"])) { gotoTitle(); }

    }
    if (phase === "recall") { if (edge[" "] || edge["enter"]) closeRecall(); clearEdges(); return; }
    if (phase === "setback") { setbackT -= dt; if (setbackT <= 0) phase = "play"; clearEdges(); return; }
    if (phase === "journal") { if (edge["tab"] || edge["escape"]) phase = "play"; clearEdges(); return; }
    if (edge["tab"]) { phase = "journal"; clearEdges(); return; }   // 기억 일지 열기
    elapsed += dt;

    let ix = (keys["d"]||keys["arrowright"]?1:0) - (keys["a"]||keys["arrowleft"]?1:0);
    let iy = (keys["s"]||keys["arrowdown"]?1:0) - (keys["w"]||keys["arrowup"]?1:0);

    player.vx = ix * sp; player.vy = iy * sp;
    const moving = (ix || iy) ? true : false;

    // 충돌 분리 이동
    moveAxis("x", player.vx * dt);
    moveAxis("y", player.vy * dt);
    player.x = clamp(player.x, TILE + player.w/2, NW - TILE - player.w/2);
    player.y = clamp(player.y, TILE + player.h/2, NH - TILE - player.h/2);

    if (moving) {
      if (Math.abs(ix) >= Math.abs(iy) && ix !== 0) { player.facing = "side"; player.flip = ix > 0; }
      else player.facing = "down";
      player.dir = Math.atan2(player.vy, player.vx);
      player.animT += dt; if (player.animT > 0.16) { player.animT = 0; player.frame ^= 1; player.step = (player.step||0) + 1; }
    } else player.frame = 0;

    // 기억 비추기(Q) — 빛 자원 소모 AURA(전방위). 숨은 조각 드러냄 + 주변 Murk 차단 + 피격 무효
    illuminated.clear(); projecting = false;
    if (lowLightTip > 0) lowLightTip -= dt;
    if (keys["q"]) {
      if (st.light > 0) {

        for (const s of D.shards) if (s.hidden && !isDone(s)) {
          const c = shardCenter(s);
          if (dist(player.x, player.y, c.x, c.y) <= AURA_R) illuminated.add(s.id);
        }
      } else if (lowLightTip <= 0) { toasts.push({ text: "빛이 부족하다 — 기억을 모으거나 안전지대에서 회복", color: "#9fc5c5", t: 2.0 }); lowLightTip = 2.2; }
    }

    // 발자국 추적(L) — 가장 가까운 미발견 코어로 시안 발자국 흔적(무료, 쿨다운)
    if (edge["l"]) lTutDone = true;

    if (edge["l"] && trailCD <= 0) {
      let best = null, bd = 1e9;

      if (best) { trail = []; const n = 7; for (let i = 1; i <= n; i++) trail.push({ x: player.x + (best.x - player.x) * i / n, y: player.y + (best.y - player.y) * i / n, age: 0 }); trailCD = C.TRAIL_CD; }

      else if (m.chasing) { m.lost += dt; if (m.lost > 2.5) m.chasing = false; }
      let ax, ay, spd;
      if (m.chasing) { ax = player.x; ay = player.y; spd = m.speed * 1.35; danger = true; }
      else { const w = m.patrol[m.wp]; ax = w.x; ay = w.y; spd = m.speed;
             if (dist(m.x, m.y, w.x, w.y) < 3) m.wp = (m.wp + 1) % m.patrol.length; }
      const d = dist(m.x, m.y, ax, ay) || 1;
      const nx = (ax - m.x) / d, ny = (ay - m.y) / d;
      m.x += nx * spd * dt; m.y += ny * spd * dt;
      if (Math.abs(nx) + Math.abs(ny) > 0.01) m.faceAngle = Math.atan2(ny, nx);
      if (dist(m.x, m.y, player.x, player.y) < 11 && !projecting && !(m.warded > 0)) {   // 비추는 동안/직후엔 피격 무효
        if (Core.contact(st)) { flash = 0.18; shake = 4; if (window.Audio2) Audio2.sfx("contact"); }
      }
      if (dist(m.x, m.y, player.x, player.y) < m.sightPx * 0.6) danger = true;
    }

    // 게이지 tick
    const inSafe = !!inAny(player.x, player.y, player.w, player.h, safes);
    Core.tick(st, dt, { inSafe, inDanger: danger, moving });
    if (inSafe) st.light = Math.min(C.LIGHT_MAX, st.light + 0.6 * dt);   // 안전지대에서 빛도 회복

    // 후퇴
    if (st.mem <= 0 && Core.setbackIfDead(st)) {
      const z = safes[0]; if (z) { player.x = z.x + z.w/2; player.y = z.y + z.h/2; }
      phase = "setback"; setbackT = 1.6; flash = 0.4; if (window.Audio2) Audio2.sfx("setback");
    }

    // 근처 조각 & 상호작용
    nearShard = null;
    for (const s of D.shards) {
      if (isDone(s)) continue;
      if (s.hidden && !illuminated.has(s.id)) continue;   // 숨은 조각은 비출 때만
      if (dist(player.x, player.y, shardCenter(s).x, shardCenter(s).y) < (s.radius||1.3) * TILE) { nearShard = s; break; }
    }
    if (edge["e"] && nearShard) doCollect(nearShard);

    // 힌트(H) — 빛 1 소모, 가장 가까운 미발견 코어 방향. 빛 부족 시 안내.
    if (edge["h"]) {
      if (Core.useHint(st).ok) {
        let best = null, bd = 1e9;
        for (const s of D.shards) if (!isDone(s) && s.type === "core") {
          const c = shardCenter(s), dd = dist(player.x, player.y, c.x, c.y);
          if (dd < bd) { bd = dd; best = c; }
        }
        hintTarget = best; hintTimer = best ? 3.0 : 0;
        if (!best) toasts.push({ text: "남은 코어 기억이 없다", color: "#9fc5c5", t: 1.6 });
      } else toasts.push({ text: "빛이 부족하다 — 안전지대에서 회복", color: "#9fc5c5", t: 2.0 });
    }
    if (hintTimer > 0) hintTimer -= dt;

    // 음소거
    if (edge["m"] && window.Audio2) { muted = !muted; Audio2.setMuted(muted); }

    // 위험 오디오
    if (window.Audio2) { Audio2.drone(danger ? 0.8 : 0); Audio2.heartbeat(st.mem <= 2 ? 96 : 0); }

    // 클리어 → 전환 시퀀스(부드러운 페이드 + 챕터 카드)
    if (Core.chapterClear(st) && door && dist(player.x, player.y, door.x, door.y) < 14) beginTransition();

    if (flash > 0) flash -= dt; if (shake > 0) shake -= dt * 24;
    if (veil > 0) veil = Math.max(0, veil - dt);   // 방 진입 페이드인
    if (corePulse > 0) corePulse -= dt;
    for (const t of toasts) t.t -= dt; toasts = toasts.filter(t => t.t > 0);
    clearEdges();
  }

  let nearShard = null;

  function moveAxis(axis, d) {
    if (!d) return;
    if (axis === "x") { player.x += d; const r = inAny(player.x, player.y, player.w, player.h, colls); if (r) player.x = d > 0 ? r.x - player.w/2 : r.x + r.w + player.w/2; }
    else { player.y += d; const r = inAny(player.x, player.y, player.w, player.h, colls); if (r) player.y = d > 0 ? r.y - player.h/2 : r.y + r.h + player.h/2; }
  }

  function doCollect(s) {
    const res = Core.collect(st, s) || {};
    if (res.ok === false) return;
    recall = { text: res.recallText || s.recall || "", type: res.type || s.type };
    phase = "recall";
    if (s.type === "core") {
      toasts.push({ text: "코어 기억 " + st.coreOrder.length + " / " + st.coresNeeded + " 회복!", color: "#8ef548", t: 2.4 });
      corePulse = 0.7;
      if (Core.chapterClear(st)) toasts.push({ text: "문이 열렸다 — 위쪽 ↑ 으로", color: "#34e2e2", t: 3.4 });
    } else if (s.type === "echo") toasts.push({ text: "에코 기억 — 옛 흔적을 떠올렸다", color: "#9fc5c5", t: 2.0 });
    else if (s.type === "false") toasts.push({ text: "⚠ 거짓된 기억 — 기억이 깎였다", color: "#ff7a7a", t: 2.6 });
    if (window.Audio2) { if (s.type === "false") Audio2.sfx("contact"); else Audio2.chime(); }
  }
  function closeRecall() { recall = null; phase = "play"; }

  // ── 렌더 ──────────────────────────────────────────────────
  function spriteFor() {
    if (player.facing === "side") return player.frame ? IMG.ziro_s1 : IMG.ziro_s0;
    if (!player.frame) return IMG.ziro_d0;                  // idle
    return ((player.step||0) & 1) ? IMG.ziro_d2 : IMG.ziro_d1;  // 보행 두 프레임 교차
  }

  function draw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    const sx = (Math.random() - 0.5) * 2 * Math.max(0, shake), sy = (Math.random() - 0.5) * 2 * Math.max(0, shake);
    ctx.scale(S, S); ctx.translate(sx, sy);

    if (!ready) { ctx.restore(); hudText("로딩…", NW*S/2, NH*S/2, "#34e2e2", 20, true); return; }

    // 배경
    if (IMG.room1 && IMG.room1.width) ctx.drawImage(IMG.room1, 0, 0, NW, NH);
    else { ctx.fillStyle = "#10140d"; ctx.fillRect(0, 0, NW, NH); }

    // 문(클리어 가능 시 빛남)
    if (door && Core.chapterClear(st)) {
      ctx.save(); ctx.globalAlpha = 0.6 + 0.3*Math.sin(performance.now()/200);
      ctx.fillStyle = "#34e2e2"; ctx.fillRect(door.x-7, door.y-7, 14, 14); ctx.restore();
    }

    // 발자국 추적 흔적
    for (const p of trail) { const a = 1 - p.age / C.TRAIL_LIFE; ctx.save(); ctx.globalAlpha = 0.55 * a; ctx.fillStyle = "#34e2e2";
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 1, 2.2, 1.6, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x - 1.6, p.y - 1.6, 0.8, 0, 7); ctx.arc(p.x + 1.6, p.y - 1.6, 0.8, 0, 7); ctx.fill(); ctx.restore(); }
    // 기억 비추기 aura(전방위 발광 원) — 주변 그림자를 밀어내는 보호막
    if (projecting) {
      const ar = AURA_R, pul = 0.5 + 0.5 * Math.sin(performance.now() / 130), cyx = player.x, cyy = player.y - 2;
      ctx.save();
      const g = ctx.createRadialGradient(cyx, cyy, 3, cyx, cyy, ar);
      g.addColorStop(0, "rgba(154,246,246,0.30)"); g.addColorStop(0.65, "rgba(52,226,226,0.12)"); g.addColorStop(1, "rgba(52,226,226,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cyx, cyy, ar, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.35 + 0.35 * pul; ctx.strokeStyle = "#9af6f6"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cyx, cyy, ar * (0.82 + 0.12 * pul), 0, 7); ctx.stroke();
      ctx.restore();
    }

    // 환경 단서: 미발견 조각을 거리 비례로 흐릿하게(글로우 OFF 보완 — '여기 뭔가 있다').
    //   숨은 조각은 제외(Q로만). 거짓은 차갑게 깜빡여 미묘한 '어긋남' 신호.
    for (const s of D.shards) {
      if (isDone(s) || s.hidden) continue;
      const c = shardCenter(s), d = dist(player.x, player.y, c.x, c.y);
      if (d > 120) continue;
      const fal = s.type === "false";
      const a = Math.max(0.1, Math.min(0.55, 1 - d / 120)) * (0.6 + 0.4 * Math.sin(performance.now() / (fal ? 170 : 320)));
      ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = fal ? "#caa15a" : "#34e2e2"; ctx.shadowBlur = 5;
      ctx.fillStyle = fal ? "#caa15a" : "#34e2e2";
      ctx.beginPath(); ctx.arc(c.x, c.y - 1, fal ? 2.0 : 2.6, 0, 7); ctx.fill(); ctx.restore();
    }

    // 근처 조각만 표시(글로우 OFF·3단 발견)
    if (nearShard && IMG.shard) {
      const c = shardCenter(nearShard);
      glow(() => ctx.drawImage(IMG.shard, c.x - IMG.shard.width/2, c.y - IMG.shard.height/2), "#34e2e2", 8);
      tag("조사 [E]", c.x, c.y - 14);
    }

    // y정렬: murk/player
    const ents = [...murks.map(m => ({ y: m.y, m })), { y: player.y, p: true }];
    ents.sort((a, b) => a.y - b.y);
    for (const e of ents) {
      if (e.p) {
        const sp = spriteFor();
        if (sp && sp.width) {
          const sneak = !!keys["shift"];                          // 은신: 흐려지고 글로우 약화(피드백)
          ctx.save(); if (sneak) ctx.globalAlpha = 0.6;
          if (player.facing === "side" && player.flip) { ctx.translate(player.x, 0); ctx.scale(-1, 1); ctx.translate(-player.x, 0); }
          glow(() => ctx.drawImage(sp, Math.round(player.x - sp.width/2), Math.round(player.y - sp.height + 6)), sneak ? "#2a3d2a" : "#8ef548", sneak ? 1 : 3);
          ctx.restore();
        }
      } else {
        const m = e.m;
        // 시야콘 (감지 범위 시각화 — 평시 보라, 추격 빨강)
        const hf = (m.fov * Math.PI / 180) / 2;
        ctx.save(); ctx.globalAlpha = m.chasing ? 0.18 : 0.08; ctx.fillStyle = m.chasing ? "#ff5a5a" : "#7a5cff";
        ctx.beginPath(); ctx.moveTo(m.x, m.y);
        ctx.arc(m.x, m.y, m.sightPx, m.faceAngle - hf, m.faceAngle + hf); ctx.closePath(); ctx.fill(); ctx.restore();
        if (IMG.murk) glow(() => ctx.drawImage(IMG.murk, Math.round(m.x - IMG.murk.width/2), Math.round(m.y - IMG.murk.height/2)), m.chasing ? "#ff5a5a" : "#7a5cff", m.chasing ? 5 : 2);
      }
    }

    // 힌트 화살표(H) — 코어 방향 점선 + 펄스 화살표(잘 보이게)
    if (hintTimer > 0 && hintTarget) {
      const a = Math.atan2(hintTarget.y - player.y, hintTarget.x - player.x);
      const pul = 0.6 + 0.4 * Math.sin(performance.now() / 140);
      ctx.save(); ctx.globalAlpha = 0.4 * pul; ctx.strokeStyle = "#8ef548"; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(player.x + Math.cos(a) * 12, player.y + Math.sin(a) * 12);
      ctx.lineTo(player.x + Math.cos(a) * 30, player.y + Math.sin(a) * 30); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      ctx.save(); ctx.globalAlpha = 0.7 + 0.3 * pul; ctx.translate(player.x + Math.cos(a) * 26, player.y + Math.sin(a) * 26); ctx.rotate(a);
      ctx.fillStyle = "#8ef548"; ctx.shadowColor = "#8ef548"; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-4, -6); ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // 피격 플래시
    if (flash > 0) { ctx.fillStyle = `rgba(255,90,90,${Math.min(0.5, flash)})`; ctx.fillRect(0, 0, NW, NH); }

    ctx.restore();
    drawHUD();
    if (phase === "play") drawGuide();
    if (phase === "title") overlayTitle();
    if (phase === "recall" && recall) overlayRecall();
    if (phase === "setback") overlayCenter("…어둡다. 여기는…", "#9ab", "방금 떠올린 기억이 다시 어둠에 잠겼다 · 같은 자리에서 되찾을 수 있다");
    if (phase === "cleared") overlayCenter("챕터 1 클리어 · 「지로의 방」", "#8ef548", "지로가 첫 기억들을 되찾았다.");
    if (phase === "intro") overlayIntro();
    if (phase === "transition") overlayTransition();
    if (phase === "journal" && window.Journal) { try { Journal.draw(ctx, cv, st, D, IMG); } catch (e) { console.error(e); } }
    if (veil > 0) { ctx.save(); ctx.fillStyle = "rgba(3,5,9," + Math.min(1, veil / 0.8) + ")"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); }
  }

  // 인트로(콜드 오픈) — 어둠 속에서 눈을 뜨는 지로 + 흐릿한 독백 (01 §2-1)
  function overlayIntro() {
    ctx.save();
    ctx.fillStyle = "#03060a"; ctx.fillRect(0, 0, cv.width, cv.height);
    const eo = Math.min(1, Math.max(0, (introT - 1.0) / 1.6));   // 눈 서서히 켜짐
    if (eo > 0) {
      ctx.globalAlpha = eo * 0.92; ctx.fillStyle = "#9bf24a"; ctx.shadowColor = "#34e2e2"; ctx.shadowBlur = 18;
      const cy = cv.height / 2 - 50;
      ctx.beginPath(); ctx.ellipse(cv.width / 2 - 28, cy, 13, 19, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cv.width / 2 + 28, cy, 13, 19, 0, 0, 7); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    let cur = INTRO[0]; for (const b of INTRO) if (introT >= b.at) cur = b;
    ctx.globalAlpha = Math.min(1, (introT - cur.at) / 0.6);
    ctx.textAlign = "center"; ctx.fillStyle = "#cfe6e6"; ctx.font = "20px 'Noto Sans KR',sans-serif";
    ctx.fillText(cur.line, cv.width / 2, cv.height / 2 + 70);
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#5a7375"; ctx.font = "13px 'Noto Sans KR',sans-serif";
    ctx.fillText("아무 키 / 클릭 — 건너뛰기", cv.width / 2, cv.height - 40);
    ctx.restore();
  }

  // 스테이지 전환 — 페이드 아웃 + 챕터 카드
  function overlayTransition() {
    const fade = Math.min(1, transT / 1.0);
    ctx.save();
    ctx.fillStyle = "rgba(3,5,9," + fade + ")"; ctx.fillRect(0, 0, cv.width, cv.height);
    if (transT > 1.0) {
      ctx.globalAlpha = Math.min(1, (transT - 1.0) / 0.7); ctx.textAlign = "center";
      ctx.fillStyle = "#8ef548"; ctx.font = "bold 30px 'Noto Sans KR',sans-serif";
      ctx.fillText("CHAPTER 1 · 클리어", cv.width / 2, cv.height / 2 - 12);
      ctx.fillStyle = "#eafaff"; ctx.font = "20px 'Noto Sans KR',sans-serif";
      ctx.fillText("「지로의 방」", cv.width / 2, cv.height / 2 + 22);
      ctx.fillStyle = "#9fb6b6"; ctx.font = "14px 'Noto Sans KR',sans-serif";
      ctx.fillText(hasNext ? "지로가 첫 기억들을 되찾았다 — 다음 이야기로…" : "지로가 첫 기억들을 되찾았다.", cv.width / 2, cv.height / 2 + 54);
      if (!hasNext) { ctx.fillStyle = "#8ef548"; ctx.font = "13px 'Noto Sans KR',sans-serif"; ctx.fillText("[Space] 처음으로", cv.width / 2, cv.height / 2 + 86); }
    }
    ctx.restore();
  }

  function glow(fn, color, blur) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore(); }
  function tag(t, x, y) { ctx.save(); ctx.font = "6px sans-serif"; ctx.textAlign = "center";
    const w = ctx.measureText(t).width + 6; ctx.fillStyle = "rgba(6,14,18,.85)"; ctx.fillRect(x - w/2, y - 7, w, 9);
    ctx.fillStyle = "#bfffff"; ctx.fillText(t, x, y); ctx.restore(); }

  // ── HUD (스케일 1:1, 픽셀 위 오버레이) ─────────────────────
  function drawHUD() {
    if (!ready) return;
    const W = cv.width;
    // 메모리 미터(발바닥 10칸)
    const pipW = 16, x0 = 16, y0 = cv.height - 28;
    ctx.save();
    ctx.fillStyle = "rgba(10,16,20,.85)"; rrect(x0 - 10, y0 - 12, pipW*10 + 64, 30, 8); ctx.fill();
    ctx.font = "13px 'Noto Sans KR',sans-serif"; ctx.fillStyle = st.mem <= 2 ? "#ff7a7a" : "#bfffff";
    ctx.textAlign = "left"; ctx.fillText("기억", x0, y0 + 8);
    for (let i = 0; i < C.MEM_MAX; i++) {
      const fillAmt = clamp(st.mem - i, 0, 1);
      const cx = x0 + 40 + i * pipW + 7, cy = y0 + 3;
      paw(cx, cy, "#16262a");                       // 빈칸
      if (fillAmt >= 1) paw(cx, cy, st.mem <= 2 ? "#ff5a5a" : "#34e2e2");
      else if (fillAmt > 0) { ctx.save(); ctx.beginPath(); ctx.rect(cx - 6, cy - 7, 6, 14); ctx.clip(); paw(cx, cy, "#34e2e2"); ctx.restore(); }
    }
    ctx.font = "11px 'Noto Sans KR',sans-serif"; ctx.fillStyle = "#9fc5c5";
    ctx.fillText("생명 — 0이 되면 후퇴", x0, y0 - 16);
    // 정체성 + 코어 카운터(우상단)
    ctx.fillStyle = "rgba(10,16,20,.85)"; rrect(W - 230, 14, 216, 56, 8); ctx.fill();
    const idn = (st.identity || 0);
    ctx.fillStyle = "#0e0f13"; ctx.beginPath(); ctx.arc(W - 200, 42, 20, 0, 7); ctx.fill();
    ctx.strokeStyle = "#34e2e2"; ctx.lineWidth = 2; ctx.stroke();
    if (idn <= 0 || !IMG.ziro_d0) { ctx.fillStyle = "#34e2e2"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText("?", W - 200, 50); }
    else ctx.drawImage(IMG.ziro_d0, W - 218, 24, 36, 38);
    ctx.textAlign = "left"; ctx.fillStyle = "#eafaff"; ctx.font = "bold 15px 'Noto Sans KR',sans-serif";
    ctx.fillText(idn > 0 && D.identityLabels[idn-1] ? D.identityLabels[idn-1] : "정체 미상", W - 170, 38);
    ctx.fillStyle = "#6b8a8c"; ctx.font = "12px 'Noto Sans KR',sans-serif";
    ctx.fillText("정체성 " + idn + " / 5", W - 170, 58);
    // 코어 카운터(좌상단) — 주 목표 지표. 획득 시 펄스.
    ctx.fillStyle = "rgba(10,16,20,.85)"; rrect(14, 14, 160, 30, 8); ctx.fill();
    const cp = corePulse > 0 ? corePulse : 0;
    ctx.fillStyle = cp > 0 ? "#d6ff9a" : "#8ef548"; ctx.font = "bold " + (15 + Math.round(cp * 8)) + "px 'Noto Sans KR',sans-serif";
    ctx.fillText("코어 기억 " + (st.coreOrder ? st.coreOrder.length : 0) + " / " + st.coresNeeded, 26, 35);
    // 빛 게이지 바(코어 카운터 아래)
    ctx.fillStyle = "#16262a"; ctx.fillRect(26, 50, 100, 6);
    ctx.fillStyle = "#34e2e2"; ctx.fillRect(26, 50, 100 * (st.light / C.LIGHT_MAX), 6);
    ctx.fillStyle = "#9fc5c5"; ctx.font = "11px 'Noto Sans KR',sans-serif";
    ctx.fillText("빛 " + (st.light||0).toFixed(1) + "   [Q]비추기·[H]힌트", 132, 56);
    ctx.fillStyle = trailCD > 0 ? "#8aa7a9" : "#8ef548";
    ctx.fillText(trailCD > 0 ? "[L] 발자국 추적  " + trailCD.toFixed(0) + "s" : "[L] 발자국 추적 (사용가능)", 26, 70);
    ctx.fillStyle = "#9fc5c5"; ctx.fillText("[Tab] 기억 일지", 26, 86);
    ctx.restore();
  }
  function paw(cx, cy, col) { ctx.fillStyle = col; ctx.beginPath();
    ctx.ellipse(cx, cy + 3, 5, 4, 0, 0, 7); ctx.fill();
    for (const [dx, dy, r] of [[-4,-3,2],[0,-5,2.2],[4,-3,2]]) { ctx.beginPath(); ctx.arc(cx+dx, cy+dy, r, 0, 7); ctx.fill(); } }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function hudText(t, x, y, col, size, center) { ctx.save(); ctx.font = `bold ${size}px 'Noto Sans KR',sans-serif`;
    ctx.fillStyle = col; ctx.textAlign = center ? "center" : "left"; ctx.fillText(t, x, y); ctx.restore(); }

  // ── 인게임 가이드(온보딩/피드백) ─────────────────────────
  function drawGuide() {
    if (!ready) return;
    const W = cv.width, cores = (st.coreOrder ? st.coreOrder.length : 0), need = st.coresNeeded;
    const done = cores >= need;
    if (keys["shift"]) { ctx.save(); ctx.textAlign = "center"; ctx.font = "bold 12px 'Noto Sans KR',sans-serif"; ctx.fillStyle = "#7fb0b3"; ctx.fillText("은신 중", player.x * S, player.y * S - 42); ctx.restore(); }
    // 목표 배너(상단 중앙)
    ctx.save();
    const bw = 380, bx = (W - bw) / 2, by = 12;
    ctx.fillStyle = "rgba(8,14,18,.82)"; rrect(bx, by, bw, 34, 10); ctx.fill();
    ctx.textAlign = "left"; ctx.font = "bold 14px 'Noto Sans KR',sans-serif";
    if (done) { ctx.fillStyle = "#34e2e2"; ctx.textAlign = "center"; ctx.fillText("문이 열렸다 — 위쪽 ↑ 문으로 가라", W / 2, by + 22); }
    else {
      ctx.fillStyle = "#eafaff"; ctx.fillText("목표 · 코어 기억 모으기", bx + 14, by + 22);
      const dotx = bx + 158;
      for (let i = 0; i < need; i++) { ctx.beginPath(); ctx.arc(dotx + i * 20, by + 16, 6, 0, 7); ctx.fillStyle = i < cores ? "#8ef548" : "#27343a"; ctx.fill(); }
      ctx.fillStyle = "#9fc5c5"; ctx.font = "12px 'Noto Sans KR',sans-serif"; ctx.fillText("빛나는 기억에 다가가 [E]", dotx + need * 20 + 6, by + 22);
    }
    ctx.restore();
    // 클리어 시 문 방향 화살표(상단)
    if (done && door) { ctx.save(); ctx.textAlign = "center"; ctx.font = "bold 26px sans-serif"; ctx.fillStyle = "#34e2e2";
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 200); ctx.fillText("↑", door.x * S, 72); ctx.restore(); }
    // 진행 토스트(좌상단 코어 카운터 아래)
    let ty = 92; ctx.save(); ctx.textAlign = "left"; ctx.font = "bold 14px 'Noto Sans KR',sans-serif";
    for (const t of toasts) { const a = Math.min(1, t.t); ctx.globalAlpha = a;
      const tw = ctx.measureText(t.text).width + 20;
      ctx.fillStyle = "rgba(8,14,18,.88)"; rrect(14, ty, tw, 24, 8); ctx.fill();
      ctx.globalAlpha = a; ctx.fillStyle = t.color; ctx.fillText(t.text, 24, ty + 16); ty += 28; }
    ctx.restore();
    // L 코치마크(첫 코어 전, 무입력 후) — 빈 방 문제 직격
    if (cores === 0 && elapsed > 3 && !lTutDone && trail.length === 0) {
      const spx = player.x * S, spy = player.y * S;
      ctx.save(); ctx.textAlign = "center"; ctx.font = "bold 13px 'Noto Sans KR',sans-serif";
      const txt = "[L] 발자국 추적 — 기억의 흔적을 따라가자";
      const tw = ctx.measureText(txt).width + 20;
      ctx.fillStyle = "rgba(8,14,18,.92)"; rrect(spx - tw / 2, spy - 74, tw, 26, 8); ctx.fill();
      ctx.fillStyle = "#8ef548"; ctx.fillText(txt, spx, spy - 56); ctx.restore();
    }
    // 조작 힌트(하단) — 이 스테이지에서 쓰는 단축키만(data의 controls)
    if (cores === 0 || elapsed < 16) {
      const list = (D.controls && D.controls.length) ? D.controls
        : [["이동", "WASD"], ["조사", "E"], ["추적", "L"], ["일지", "Tab"]];
      const txt = list.map(c => "[" + c[1] + "] " + c[0]).join("   ·   ");
      ctx.save(); ctx.textAlign = "center"; ctx.font = "12px 'Noto Sans KR',sans-serif";
      const tw = ctx.measureText(txt).width + 24;
      ctx.fillStyle = "rgba(8,14,18,.75)"; rrect((W - tw) / 2, cv.height - 74, tw, 22, 8); ctx.fill();
      ctx.fillStyle = "#bcd6d6"; ctx.fillText(txt, W / 2, cv.height - 59); ctx.restore();
    }
  }

  function overlayTitle() {
    ctx.save(); ctx.fillStyle = "rgba(4,6,10,.72)"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center"; ctx.fillStyle = "#eafaff"; ctx.font = "bold 44px 'Noto Sans KR',sans-serif";
    ctx.fillText("잊혀진 발자국", cv.width/2, cv.height/2 - 40);
    ctx.fillStyle = "#34e2e2"; ctx.font = "18px 'Noto Sans KR',sans-serif";
    ctx.fillText("LOST PAWPRINT — 지로 · 챕터 1 「지로의 방」", cv.width/2, cv.height/2 - 6);
    ctx.fillStyle = "#cfe6e6"; ctx.font = "16px 'Noto Sans KR',sans-serif";
    ctx.fillText("코어 기억 3개를 찾아 문을 열어라.  닿으면 기억이 흐려진다.", cv.width/2, cv.height/2 + 30);
    ctx.fillStyle = "#8ef548"; ctx.font = "bold 18px 'Noto Sans KR',sans-serif";
    ctx.fillText("▶ 클릭 / 아무 키로 시작", cv.width/2, cv.height/2 + 66); ctx.restore();
  }
  function overlayRecall() {
    ctx.save(); ctx.fillStyle = "rgba(3,6,10,.78)"; ctx.fillRect(0, 0, cv.width, cv.height);
    const w = Math.min(760, cv.width - 80), x = (cv.width - w)/2, y = cv.height/2 - 70;
    ctx.fillStyle = "#070d11"; ctx.strokeStyle = recall.type === "false" ? "#caa15a" : "#34e2e2"; ctx.lineWidth = 2;
    rrect(x, y, w, 140, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = recall.type === "false" ? "#e8c884" : "#34e2e2"; ctx.textAlign = "left";
    ctx.font = "bold 16px 'Noto Sans KR',sans-serif";
    ctx.fillText(recall.type === "false" ? "[회상 — 무언가 어긋난다]" : "[회상]", x + 24, y + 34);
    ctx.fillStyle = "#eef7f7"; ctx.font = "18px 'Noto Sans KR',sans-serif";
    wrap(recall.text, x + 24, y + 66, w - 48, 26);
    ctx.fillStyle = "#6b8a8c"; ctx.font = "14px 'Noto Sans KR',sans-serif"; ctx.textAlign = "right";
    ctx.fillText("[Space] 계속", x + w - 20, y + 124); ctx.restore();
  }
  function overlayCenter(title, col, sub) {
    ctx.save(); ctx.fillStyle = "rgba(3,5,9,.8)"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center"; ctx.fillStyle = col; ctx.font = "bold 34px 'Noto Sans KR',sans-serif";
    ctx.fillText(title, cv.width/2, cv.height/2 - 6);
    if (sub) { ctx.fillStyle = "#9fb6b6"; ctx.font = "16px 'Noto Sans KR',sans-serif"; ctx.fillText(sub, cv.width/2, cv.height/2 + 28); }
    ctx.restore();
  }
  function wrap(t, x, y, maxw, lh) { const words = (t||"").split(/\s+/); let line = "", yy = y;
    for (const w of words) { const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxw && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = test; }
    if (line) ctx.fillText(line, x, yy); }

  // ── 루프 ──────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) { let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
    try { update(dt); } catch (e) { console.error(e); }
    draw(); requestAnimationFrame(frame); }
  // 디버그 스냅샷(테스트용, 무해): 상태 읽기 전용
  if (typeof window !== 'undefined') window.__ziro = () => ({ phase, px: player.x, py: player.y, mem: st ? st.mem : 0, ch: chapterIdx });
  loadStage(0);                 // 첫 챕터 초기화(맵·엔티티·상태)
  requestAnimationFrame(frame);
})();

</script>
